<!-- JS: Logo click admin access                  -->
<!-- ============================================ -->
<script>
(function() {
    let logoClickCounter = 0;
    
    function handleLogoClick(e) {
        e.preventDefault();
        const userLoggedIn = sessionStorage.getItem('user_logged_in') === 'true';
        const adminLoggedIn = sessionStorage.getItem('admin_logged_in') === 'true';
        if (userLoggedIn && !adminLoggedIn) { alert('🚫 Access Denied! Only Admin can access this page.'); logoClickCounter = 0; return; }
        logoClickCounter++;
        const requiredClicks = window.appState.logoClickCount || 2;
        if (logoClickCounter >= requiredClicks) { logoClickCounter = 0; window.location.href = 'admin.html'; }
    }

    document.getElementById('logoIcon').addEventListener('click', handleLogoClick);
    document.getElementById('logoImage').addEventListener('click', handleLogoClick);
    document.getElementById('brandSection').addEventListener('click', function(e) {
        if (e.target.closest('.logo-icon') || e.target.closest('.logo-img') || e.target.closest('.brand-name')) {
            handleLogoClick(e);
        }
    });
})();
</script>
