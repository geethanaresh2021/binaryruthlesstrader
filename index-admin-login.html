<!-- ─── ADMIN LOGIN PAGE ─── -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Admin Login - Binary Ruthless Trader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:opsz,wght@14..32,300;400;600;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="index.css" />
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js",
                "firebase/database": "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js",
                "firebase/analytics": "https://www.gstatic.com/firebasejs/12.16.0/firebase-analytics.js"
            }
        }
    </script>
    <style>
        .admin-login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .admin-login-card {
            background: rgba(20,20,20,0.97);
            border: 2px solid rgba(255,0,51,0.2);
            border-radius: 16px;
            padding: 40px 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .admin-login-card h2 {
            color: #FFD700;
            font-family: 'Orbitron', sans-serif;
            margin-bottom: 20px;
        }
        .admin-login-card input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,0,51,0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            text-align: center;
            outline: none;
        }
        .admin-login-card input:focus {
            border-color: #FF0033;
            box-shadow: 0 0 20px rgba(255,0,51,0.1);
        }
        .admin-login-card .error-msg {
            color: #FF0033;
            font-size: 0.8rem;
            min-height: 20px;
            margin: 5px 0;
        }
        .admin-login-card button {
            width: 100%;
            padding: 12px;
            background: #FF0033;
            color: #fff;
            border: none;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 10px;
            transition: all 0.3s ease;
        }
        .admin-login-card button:hover {
            box-shadow: 0 0 30px rgba(255,0,51,0.3);
            transform: scale(1.02);
        }
        .back-link {
            color: #aaa;
            margin-top: 15px;
            display: inline-block;
            font-size: 0.8rem;
            text-decoration: none;
            cursor: pointer;
        }
        .back-link:hover {
            color: #FF0033;
        }
    </style>
</head>
<body>
    <div class="admin-login-container">
        <div class="admin-login-card">
            <h2>🔐 Admin Login</h2>
            <input type="password" id="adminPassword" placeholder="Enter Admin Password" />
            <div class="error-msg" id="adminLoginError"></div>
            <button id="adminLoginBtn">Login</button>
            <a href="index.html" class="back-link">← Back to Home</a>
        </div>
    </div>

    <script type="module">
        import { appState, adminLogin } from "./security.js";

        // ─── HANDLE ADMIN LOGIN ───
        document.getElementById('adminLoginBtn').addEventListener('click', function() {
            const password = document.getElementById('adminPassword').value;
            const errorEl = document.getElementById('adminLoginError');
            
            if (!password) {
                errorEl.textContent = '❌ Please enter password';
                return;
            }
            
            if (adminLogin(password)) {
                window.location.href = 'admin.html';
            } else {
                errorEl.textContent = '❌ Invalid password';
            }
        });

        // ─── ENTER KEY ───
        document.getElementById('adminPassword').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('adminLoginBtn').click();
            }
        });

        console.log('🔐 Admin Login Page Loaded');
    </script>
</body>
</html>
