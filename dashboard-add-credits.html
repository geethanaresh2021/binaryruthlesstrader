<!-- Contains: HTML + CSS + JS for Add Credits     -->

<style>
    /* ─── CREDIT PACKS CSS ─── */
    .credit-packs {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
        margin: 4px 0;
    }
    .credit-pack {
        flex: 1;
        min-width: 80px;
        max-width: 120px;
        background: rgba(255,255,255,0.02);
        border-radius: 10px;
        padding: 8px;
        text-align: center;
        border: 1px solid rgba(255,0,51,0.08);
        transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        cursor: pointer;
    }
    .credit-pack:hover {
        border-color: #FF0033;
        transform: translateY(-3px) scale(1.03);
        box-shadow: 0 0 24px rgba(255,0,51,0.05);
    }
    .credit-pack.selected {
        border-color: #FFD700;
        box-shadow: 0 0 32px rgba(255,215,0,0.1);
    }
    .credit-pack .credits {
        font-size: 1rem;
        font-weight: 700;
        color: #FFD700;
        font-family: 'Roboto Mono', monospace;
    }
    .credit-pack .price {
        font-size: 0.7rem;
        color: #aaa;
    }
    .credit-pack .per-credit {
        font-size: 0.45rem;
        color: #666;
    }

    /* ─── SELECTED PACK DISPLAY ─── */
    .selected-pack-display {
        display: none;
        margin-top: 6px;
        padding: 8px;
        background: rgba(255,215,0,0.05);
        border-radius: 6px;
        border: 1px solid rgba(255,215,0,0.15);
        text-align: center;
    }
    .selected-pack-display.active {
        display: block;
    }
    .selected-pack-display .pack-title {
        color: #FFD700;
        font-size: 0.55rem;
        font-family: 'Orbitron', sans-serif;
    }
    .selected-pack-display .pack-details {
        color: #ffffff;
        font-size: 0.8rem;
        margin-top: 2px;
    }
    .selected-pack-display .pack-details span {
        color: #FFD700;
        font-weight: 700;
    }

    /* ─── PAYMENT INSTRUCTIONS ─── */
    .payment-instructions {
        background: rgba(255,215,0,0.03);
        border: 1px solid rgba(255,215,0,0.1);
        border-radius: 10px;
        padding: 10px;
        margin: 4px 0;
    }
    .payment-instructions h4 {
        color: #FFD700;
        font-size: 0.6rem;
        margin-bottom: 2px;
        font-family: 'Orbitron', sans-serif;
    }
    .payment-instructions p {
        color: #aaa;
        font-size: 0.5rem;
    }

    /* ─── QR CONTAINER ─── */
    .qr-container {
        text-align: center;
        padding: 8px;
        background: #fff;
        border-radius: 10px;
        margin: 4px 0;
    }
    .qr-container img {
        max-width: 160px;
        max-height: 160px;
        border-radius: 6px;
    }
    .qr-container .qr-placeholder {
        color: #666;
        font-size: 0.45rem;
        padding: 16px;
        text-align: center;
    }

    /* ─── MODAL OVERLAY & MODAL (shared) ─── */
    .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.85);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        padding: 20px;
        backdrop-filter: blur(10px);
        animation: fadeInAddCredits 0.3s ease;
    }
    .overlay.active {
        display: flex;
    }
    @keyframes fadeInAddCredits {
        0% { opacity: 0; transform: scale(0.96); }
        100% { opacity: 1; transform: scale(1); }
    }

    .modal {
        background: rgba(20,20,20,0.97);
        backdrop-filter: blur(20px);
        border: 2px solid rgba(255,0,51,0.2);
        border-radius: 16px;
        padding: 28px 24px;
        width: 100%;
        max-width: 600px;
        min-height: 280px;
        max-height: 85vh;
        overflow-y: auto;
        position: relative;
        box-shadow: 0 0 80px rgba(255,0,51,0.08);
        animation: modalSlideAddCredits 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes modalSlideAddCredits {
        0% { opacity: 0; transform: translateY(30px) scale(0.96); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .modal::-webkit-scrollbar {
        width: 4px;
    }
    .modal::-webkit-scrollbar-thumb {
        background: #FF0033;
        border-radius: 4px;
    }

    .modal-close {
        position: absolute;
        top: 10px;
        right: 14px;
        font-size: 1.5rem;
        color: #FF0033;
        cursor: pointer;
        background: none;
        border: none;
        transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        padding: 4px 8px;
        border-radius: 6px;
        font-weight: 700;
    }
    .modal-close:hover {
        transform: scale(1.3) rotate(90deg);
        color: #ffffff;
        background: rgba(255,0,51,0.06);
    }
    .modal-close:active {
        transform: scale(0.8);
    }

    .modal h2 {
        color: #FFD700;
        text-align: center;
        font-family: 'Orbitron', sans-serif;
        font-size: 1rem;
        margin-bottom: 14px;
        letter-spacing: 2px;
    }
    .modal label {
        display: block;
        font-size: 0.55rem;
        color: #FFD700;
        margin: 6px 0 3px;
        text-transform: uppercase;
        font-weight: 700;
        letter-spacing: 1px;
    }
    .modal input {
        width: 100%;
        padding: 7px 12px;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,0,51,0.1);
        border-radius: 6px;
        color: #ffffff;
        font-family: 'Inter', sans-serif;
        font-size: 0.75rem;
        outline: none;
        transition: all 0.4s ease;
    }
    .modal input:focus {
        border-color: #FF0033;
        box-shadow: 0 0 20px rgba(255,0,51,0.04);
        transform: scale(1.01);
    }

    .modal .btn-submit {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
        border-radius: 30px;
        font-weight: 700;
        border: none;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        font-family: 'Inter', sans-serif;
        font-size: 0.75rem;
        position: relative;
        overflow: hidden;
        will-change: transform;
    }
    .modal .btn-submit:hover {
        transform: scale(1.03);
        box-shadow: 0 6px 28px rgba(0,0,0,0.3);
    }
    .modal .btn-submit:active {
        transform: scale(0.97);
    }
    .modal .btn-submit.btn-gold {
        background: #FFD700;
        color: #000;
    }
    .modal .btn-submit.btn-success {
        background: #00FF66;
        color: #000;
    }
    .modal .error-msg {
        color: #FF0033;
        font-size: 0.65rem;
        margin-top: 3px;
        font-family: 'Roboto Mono', monospace;
        min-height: 18px;
    }
    .modal .success-msg {
        color: #00FF66;
        font-size: 0.65rem;
        margin-top: 3px;
        font-family: 'Roboto Mono', monospace;
    }

    /* ─── NO CREDITS POPUP ─── */
    .no-credits-popup .modal {
        max-width: 400px;
        text-align: center;
    }

    /* ─── MOBILE ─── */
    @media (max-width: 768px) {
        .modal {
            padding: 18px 16px;
            max-width: 100%;
            max-height: 90vh;
            min-height: 240px;
        }
        .credit-pack {
            min-width: 70px;
            max-width: 100px;
        }
    }
    @media (max-width: 480px) {
        .modal {
            padding: 16px 14px;
            max-width: 100%;
            max-height: 92vh;
            min-height: 200px;
        }
        .modal h2 {
            font-size: 0.85rem;
        }
        .modal label {
            font-size: 0.48rem;
        }
        .modal input {
            font-size: 0.65rem;
            padding: 5px 8px;
        }
        .modal .btn-submit {
            font-size: 0.65rem;
            padding: 8px;
        }
        .credit-pack {
            min-width: 60px;
            max-width: 90px;
            padding: 4px;
        }
        .credit-pack .credits {
            font-size: 0.75rem;
        }
        .credit-pack .price {
            font-size: 0.55rem;
        }
    }
</style>

<!-- ─── ADD CREDITS MODAL HTML ─── -->
<div class="overlay" id="addCreditsModal">
    <div class="modal">
        <button class="modal-close" onclick="closeAddCreditsModal()">✕</button>
        <h2>💳 ADD CREDITS</h2>
        <div id="creditPacksContainer">
            <div class="credit-packs" id="creditPacksList"></div>
        </div>
        <button class="btn-submit" id="proceedToPayBtn" style="background:#FFD700;color:#000;margin-top:8px;display:none;" onclick="showPaymentOptions()">💳 Proceed to Payment</button>
        <div class="selected-pack-display" id="selectedPackDisplay">
            <div class="pack-title">📦 Selected Pack</div>
            <div class="pack-details"><span id="selectedPackCredits">0</span> Credits - ₹<span id="selectedPackPrice">0</span></div>
        </div>
        <div id="paymentOptionsContainer" style="display:none;margin-top:8px;">
            <div class="payment-instructions">
                <h4>📋 Payment Instructions</h4>
                <p id="paymentInstructionsText">Please transfer the amount to the UPI ID below.</p>
                <p style="margin-top:2px;color:#FFD700;font-size:0.6rem;">UPI: <span id="paymentUpiDisplay">binary@ruthless</span></p>
            </div>
            <div class="qr-container" id="qrDisplayContainer">
                <div id="qrDisplayContent">
                    <div class="qr-placeholder">No QR Code uploaded</div>
                </div>
            </div>
            <label>UTR Number</label>
            <input type="text" id="utrInput" placeholder="Enter UTR number">
            <label style="margin-top:4px;">Transaction ID</label>
            <input type="text" id="transactionIdInput" placeholder="Enter Transaction ID">
            <label style="margin-top:4px;">Screenshot (Optional)</label>
            <input type="file" id="screenshotUploadInput" accept="image/*">
            <button class="btn-submit btn-gold" style="margin-top:6px;" onclick="submitManualPayment()">📤 Submit Payment</button>
        </div>
        <div class="error-msg" id="addCreditsError"></div>
        <div class="success-msg" id="addCreditsSuccess"></div>
    </div>
</div>

<!-- ─── NO CREDITS POPUP HTML ─── -->
<div class="overlay no-credits-popup" id="noCreditsPopup">
    <div class="modal">
        <button class="modal-close" onclick="closeNoCreditsPopup()">✕</button>
        <span style="font-size:2.5rem;display:block;margin-bottom:4px;">⚠️</span>
        <h2 style="color:#FF0033;">Insufficient Credits!</h2>
        <p style="color:#aaa;font-size:0.85rem;margin:8px 0 12px;">You don't have enough credits. Please add credits to continue using tools.</p>
        <button class="btn-submit btn-gold" onclick="closeNoCreditsPopup();openAddCreditsModal();" style="background:#FFD700;color:#000;">💳 Add Credits</button>
    </div>
</div>

<script>
    // ─── ADD CREDITS FUNCTIONS ───

    let selectedCreditPack = null;

    // Render Credit Packs
    function renderCreditPacks() {
        const container = document.getElementById('creditPacksList');
        if (!container) return;
        container.innerHTML = '';
        
        const packs = (typeof appState !== 'undefined' && appState.creditPacks) ? appState.creditPacks : [];
        
        packs.forEach((pack, idx) => {
            const perCredit = (pack.price / pack.credits).toFixed(2);
            container.innerHTML += `
                <div class="credit-pack" onclick="selectCreditPack(${idx})" data-index="${idx}">
                    <div class="credits">${pack.credits}</div>
                    <div class="price">₹${pack.price}</div>
                    <div class="per-credit">₹${perCredit}/credit</div>
                </div>
            `;
        });
    }

    // Select Credit Pack
    function selectCreditPack(idx) {
        const packs = (typeof appState !== 'undefined' && appState.creditPacks) ? appState.creditPacks : [];
        if (!packs[idx]) return;
        
        // Remove selected class from all
        document.querySelectorAll('.credit-pack').forEach(p => p.classList.remove('selected'));
        // Add selected class to clicked
        document.querySelectorAll('.credit-pack')[idx].classList.add('selected');
        
        selectedCreditPack = packs[idx];
        document.getElementById('selectedPackDisplay').classList.add('active');
        document.getElementById('selectedPackCredits').textContent = selectedCreditPack.credits;
        document.getElementById('selectedPackPrice').textContent = selectedCreditPack.price;
        document.getElementById('proceedToPayBtn').style.display = 'block';
        document.getElementById('paymentOptionsContainer').style.display = 'none';
        document.getElementById('addCreditsError').textContent = '';
        document.getElementById('addCreditsSuccess').textContent = '';
    }

    // Open Add Credits Modal
    function openAddCreditsModal() {
        const user = (typeof appState !== 'undefined') ? appState.currentUser : null;
        if (!user) return;
        
        selectedCreditPack = null;
        document.getElementById('selectedPackDisplay').classList.remove('active');
        document.getElementById('proceedToPayBtn').style.display = 'none';
        document.getElementById('paymentOptionsContainer').style.display = 'none';
        document.getElementById('creditPacksContainer').style.display = 'block';
        document.getElementById('addCreditsError').textContent = '';
        document.getElementById('addCreditsSuccess').textContent = '';
        document.getElementById('utrInput').value = '';
        document.getElementById('transactionIdInput').value = '';
        
        renderCreditPacks();
        document.getElementById('addCreditsModal').classList.add('active');
    }

    // Close Add Credits Modal
    function closeAddCreditsModal() {
        document.getElementById('addCreditsModal').classList.remove('active');
    }

    // Show Payment Options
    function showPaymentOptions() {
        if (!selectedCreditPack) {
            document.getElementById('addCreditsError').textContent = '❌ Please select a credit pack first!';
            return;
        }
        
        document.getElementById('creditPacksContainer').style.display = 'none';
        document.getElementById('proceedToPayBtn').style.display = 'none';
        document.getElementById('selectedPackDisplay').classList.add('active');
        document.getElementById('paymentOptionsContainer').style.display = 'block';
        document.getElementById('addCreditsError').textContent = '';
        document.getElementById('addCreditsSuccess').textContent = '';
        
        const upiId = (typeof appState !== 'undefined') ? appState.upiId || 'binary@ruthless' : 'binary@ruthless';
        const instructions = (typeof appState !== 'undefined') ? appState.paymentInstructions || 'Please transfer the amount to the UPI ID below.' : 'Please transfer the amount to the UPI ID below.';
        
        document.getElementById('paymentUpiDisplay').textContent = upiId;
        document.getElementById('paymentInstructionsText').textContent = instructions;
        
        loadQRPreview();
    }

    // Load QR Preview
    function loadQRPreview() {
        const container = document.getElementById('qrDisplayContent');
        if (!container) return;
        
        const qrCodeBase64 = (typeof appState !== 'undefined') ? appState.qrCodeBase64 : '';
        
        if (qrCodeBase64) {
            container.innerHTML = `<img src="${qrCodeBase64}" alt="QR Code" style="max-width:160px;max-height:160px;border-radius:6px;" />`;
        } else {
            container.innerHTML = `<div class="qr-placeholder">No QR Code uploaded.</div>`;
        }
    }

    // Submit Manual Payment
    function submitManualPayment() {
        if (!selectedCreditPack) {
            document.getElementById('addCreditsError').textContent = '❌ Please select a credit pack first!';
            return;
        }
        
        const utr = document.getElementById('utrInput').value.trim();
        const txId = document.getElementById('transactionIdInput').value.trim();
        
        if (!utr && !txId) {
            document.getElementById('addCreditsError').textContent = '❌ Please enter UTR Number or Transaction ID';
            return;
        }
        if ((utr && utr.length < 6) || (txId && txId.length < 6)) {
            document.getElementById('addCreditsError').textContent = '❌ Enter at least 6 characters';
            return;
        }
        
        const transactionId = utr || txId;
        const user = (typeof appState !== 'undefined') ? appState.currentUser : null;
        
        if (!user) {
            document.getElementById('addCreditsError').textContent = '❌ User not found. Please login again.';
            return;
        }
        
        const paymentRecord = {
            userEmail: user.email,
            credits: selectedCreditPack.credits,
            amount: selectedCreditPack.price,
            transactionId: transactionId,
            utr: utr,
            transactionIdField: txId,
            status: 'pending',
            paymentMode: 'manual',
            date: new Date().toISOString(),
            screenshot: 'none'
        };
        
        if (typeof appState !== 'undefined') {
            if (!appState.payments) appState.payments = [];
            appState.payments.push(paymentRecord);
            if (typeof saveLocalState === 'function') saveLocalState();
        }
        
        document.getElementById('addCreditsSuccess').textContent = '✅ Payment submitted! Waiting for admin approval.';
        document.getElementById('addCreditsError').textContent = '';
        document.getElementById('utrInput').value = '';
        document.getElementById('transactionIdInput').value = '';
        
        setTimeout(() => {
            closeAddCreditsModal();
            document.getElementById('creditPacksContainer').style.display = 'block';
        }, 1500);
    }

    // Close No Credits Popup
    function closeNoCreditsPopup() {
        document.getElementById('noCreditsPopup').classList.remove('active');
    }

    // Close on Escape key
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            closeAddCreditsModal();
            closeNoCreditsPopup();
        }
    });

    // Expose functions globally
    window.openAddCreditsModal = openAddCreditsModal;
    window.closeAddCreditsModal = closeAddCreditsModal;
    window.selectCreditPack = selectCreditPack;
    window.showPaymentOptions = showPaymentOptions;
    window.submitManualPayment = submitManualPayment;
    window.loadQRPreview = loadQRPreview;
    window.renderCreditPacks = renderCreditPacks;
    window.closeNoCreditsPopup = closeNoCreditsPopup;
</script>
