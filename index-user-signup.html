<!-- JS: handleSignup() function                  -->
<!-- ============================================ -->
<script>
window.handleSignup = function() {
    const broker = document.getElementById('signupBroker').value;
    const email = document.getElementById('signupEmail').value.trim();
    const errorEl = document.getElementById('signupError');
    const successEl = document.getElementById('signupSuccess');
    errorEl.textContent = ''; successEl.textContent = '';
    if (!broker) { errorEl.textContent = '❌ Select broker'; return; }
    if (!email) { errorEl.textContent = '❌ Enter email'; return; }
    if (!window.isValidEmail(email)) { errorEl.textContent = '❌ Please enter a valid Gmail address (example@gmail.com)'; return; }
    const brokerData = window.appState.brokers.find(b => b.name === broker);
    if (!brokerData) { errorEl.textContent = '❌ Broker not found'; return; }
    if (window.appState.users.find(u => u.email === email)) { errorEl.textContent = '❌ User exists'; return; }
    const newUser = { email, accountId: '', name: email.split('@')[0], broker, verified: false, deposit: 0, requiredDeposit: brokerData.minDeposit, credits: 0, freeCredits: 0, signalsUsed: 0, todayUsed: 0, totalUsed: 0, blocked: false, registeredAt: new Date().toISOString() };
    window.appState.users.push(newUser);
    window.saveLocalState();
    if (typeof updateUI === 'function') updateUI();
    successEl.textContent = '✅ Account created! Please verify your ID. Opening broker...';
    setTimeout(() => { window.open(brokerData.link, '_blank'); }, 500);
    setTimeout(() => { window.closeModal('signupModal'); }, 1500);
};
</script>
