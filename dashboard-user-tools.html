<style>
    /* ─── TOOL FULLSCREEN OVERLAY ─── */
    .tool-fullscreen-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000;
        z-index: 10000;
        display: none;
        flex-direction: column;
        padding: 0;
    }
    .tool-fullscreen-overlay.active {
        display: flex;
    }

    /* ─── TOOL FULLSCREEN HEADER ─── */
    .tool-fullscreen-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 16px;
        flex-shrink: 0;
        background: rgba(0,0,0,0.95);
        z-index: 1;
        position: relative;
        border-bottom: 2px solid rgba(255,0,51,0.15);
        min-height: 52px;
        gap: 10px;
        flex-wrap: nowrap;
        overflow: hidden;
        width: 100%;
    }
    .tool-fullscreen-header .header-left {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-shrink: 0;
        flex-wrap: nowrap;
    }
    .tool-fullscreen-header .header-left .user-name-tool {
        color: #FFD700;
        font-size: clamp(0.85rem, 1.2vw, 1.2rem);
        font-family: 'Orbitron', sans-serif;
        letter-spacing: 1px;
        font-weight: 700;
        white-space: nowrap;
    }
    .tool-fullscreen-header .header-left .credits-tool {
        color: #00FF66;
        font-size: clamp(0.75rem, 1vw, 1rem);
        font-family: 'Roboto Mono', monospace;
        font-weight: 700;
        white-space: nowrap;
    }
    .tool-fullscreen-header .header-left .today-used-tool {
        color: #FFD700;
        font-size: clamp(0.65rem, 0.9vw, 0.9rem);
        font-weight: 700;
        white-space: nowrap;
    }
    .tool-fullscreen-header .header-left .divider {
        color: #666;
        font-size: 0.7rem;
        flex-shrink: 0;
    }

    /* ─── HEADER RIGHT - TOOL SWITCH ─── */
    .tool-fullscreen-header .header-right {
        display: flex;
        align-items: center;
        gap: 6px;
        flex: 1;
        min-width: 0;
        overflow: hidden;
        justify-content: flex-end;
    }
    .tool-switch-container {
        display: flex;
        gap: 4px;
        overflow-x: auto;
        overflow-y: hidden;
        flex: 1;
        min-width: 0;
        scrollbar-width: none;
        -ms-overflow-style: none;
        padding: 2px 0;
    }
    .tool-switch-container::-webkit-scrollbar {
        display: none;
    }
    .tool-fullscreen-header .header-right .tool-switch-btn {
        background: rgba(255,215,0,0.08);
        border: 1px solid rgba(255,215,0,0.15);
        color: #FFD700;
        padding: 2px 10px;
        border-radius: 12px;
        font-size: clamp(0.4rem, 0.6vw, 0.6rem);
        cursor: pointer;
        font-family: 'Inter', sans-serif;
        font-weight: 600;
        transition: all 0.3s ease;
        white-space: nowrap;
        flex-shrink: 0;
        max-width: 120px;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .tool-fullscreen-header .header-right .tool-switch-btn:hover {
        background: rgba(255,215,0,0.15);
        transform: scale(1.05);
    }
    .tool-fullscreen-header .header-right .tool-switch-btn.active-tool {
        background: rgba(255,0,51,0.12);
        border-color: rgba(255,0,51,0.3);
        color: #FF0033;
    }
    .tool-fullscreen-close {
        font-size: 1.8rem;
        color: #FF0033;
        cursor: pointer;
        background: none;
        border: none;
        font-weight: 700;
        transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        padding: 0 6px;
        line-height: 1;
        flex-shrink: 0;
    }
    .tool-fullscreen-close:hover {
        transform: scale(1.2) rotate(90deg);
        text-shadow: 0 0 30px rgba(255,0,51,0.3);
    }

    /* ─── TOOL CONTENT ─── */
    .tool-fullscreen-content {
        flex: 1;
        overflow: hidden;
    }
    .tool-fullscreen-content iframe {
        width: 100%;
        height: 100%;
        border: none;
        background: #0a0a0a;
    }

    /* ─── RECENT TOOLS MINI BUTTON ─── */
    .recent-tools-mini {
        display: none;
        margin: 4px 0;
        padding: 10px 18px;
        background: rgba(255,215,0,0.04);
        border: 2px solid rgba(255,215,0,0.12);
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        text-align: center;
    }
    .recent-tools-mini:hover {
        border-color: #FFD700;
        transform: scale(1.02);
    }
    .recent-tools-mini .mini-title {
        font-family: 'Orbitron', sans-serif;
        font-size: 0.7rem;
        color: #FFD700;
        letter-spacing: 1px;
    }
    .recent-tools-mini .mini-sub {
        font-size: 0.5rem;
        color: #aaa;
        margin-top: 2px;
    }

    /* ─── MOBILE ─── */
    @media (max-width: 768px) {
        .tool-fullscreen-header {
            padding: 4px 10px;
            min-height: 42px;
        }
        .tool-fullscreen-header .header-left .user-name-tool {
            font-size: 0.7rem;
        }
        .tool-fullscreen-header .header-left .credits-tool {
            font-size: 0.65rem;
        }
        .tool-fullscreen-header .header-left .today-used-tool {
            font-size: 0.6rem;
        }
        .tool-fullscreen-header .header-right .tool-switch-btn {
            font-size: 0.4rem;
            padding: 2px 6px;
            max-width: 80px;
        }
        .tool-fullscreen-close {
            font-size: 1.5rem;
        }
        .recent-tools-mini {
            padding: 8px 14px;
        }
        .recent-tools-mini .mini-title {
            font-size: 0.55rem;
        }
    }
    @media (max-width: 480px) {
        .tool-fullscreen-header {
            padding: 3px 8px;
            min-height: 36px;
        }
        .tool-fullscreen-header .header-left .user-name-tool {
            font-size: 0.55rem;
        }
        .tool-fullscreen-header .header-left .credits-tool {
            font-size: 0.5rem;
        }
        .tool-fullscreen-header .header-left .today-used-tool {
            font-size: 0.45rem;
        }
        .tool-fullscreen-header .header-right .tool-switch-btn {
            font-size: 0.35rem;
            padding: 2px 6px;
            max-width: 60px;
        }
        .tool-fullscreen-close {
            font-size: 1.3rem;
        }
        .recent-tools-mini {
            padding: 6px 12px;
        }
        .recent-tools-mini .mini-title {
            font-size: 0.5rem;
        }
        .tool-switch-container {
            gap: 4px;
        }
    }
</style>

<!-- ─── TOOL FULLSCREEN HTML ─── -->
<div class="tool-fullscreen-overlay" id="toolFullscreen">
    <div class="tool-fullscreen-header">
        <div class="header-left">
            <span class="user-name-tool" id="toolHeaderUserName">User</span>
            <span class="divider">|</span>
            <span class="credits-tool" id="toolHeaderCredits">💰 0</span>
            <span class="divider">|</span>
            <span class="today-used-tool" id="toolHeaderTodayUsed">📊 Today: 0</span>
        </div>
        <div class="header-right">
            <div class="tool-switch-container" id="toolSwitchContainer"></div>
            <button class="tool-fullscreen-close" id="toolFullscreenClose">✕</button>
        </div>
    </div>
    <div class="tool-fullscreen-content">
        <iframe id="toolFullscreenIframe" src="about:blank"></iframe>
    </div>
</div>

<!-- ─── RECENT TOOLS MINI HTML ─── -->
<div class="recent-tools-mini" id="recentToolsMini" style="display:none;">
    <div class="mini-title">📌 Recent Tools</div>
    <div class="mini-sub" id="recentToolsMiniSub">Click to open</div>
</div>

<script>
    // ─── TOOL FUNCTIONS ───
    let currentToolIndex = -1;
    let openTools = [];
    let recentTools = [];
    let isToolMinimized = false;
    let toolDataCache = {};
    let isDeducting = false;

    // Prepare tool HTML with user data injection
    function prepareToolHTML(index, htmlContent) {
        const user = (typeof appState !== 'undefined') ? appState.currentUser : null;
        if (!user) return htmlContent;

        htmlContent = htmlContent.replace(/{{USER_EMAIL}}/g, user.email);
        htmlContent = htmlContent.replace(/{{USER_NAME}}/g, user.name || user.email.split('@')[0]);
        htmlContent = htmlContent.replace(/{{USER_CREDITS}}/g, user.credits || 0);

        const injectScript = `
    <script>
        let signalGenerated = false;
        let signalSuccess = false;
        let signalSent = false;
        
        const USER_EMAIL = '${user.email}';
        const USER_NAME = '${user.name || user.email.split('@')[0]}';
        const USER_CREDITS = ${user.credits || 0};
        
        document.addEventListener('click', function(e) {
            const btn = e.target.closest('button');
            if (!btn) return;
            const text = btn.textContent || '';
            const btnId = btn.id || '';
            if (text.includes('Signal') || text.includes('Get') || text.includes('Generate') || 
                text.includes('BUY') || text.includes('SELL') || text.includes('TRADE') ||
                text.toLowerCase().includes('signal') || text.toLowerCase().includes('get') || 
                btnId === 'generateSignalBtn' || btnId === 'btnSignal' || btnId === 'getSignalBtn') {
                signalGenerated = false;
                signalSuccess = false;
                signalSent = false;
                setTimeout(() => { watchForSignalResult(); }, 500);
            }
        });
        
        function watchForSignalResult() {
            const signalView = document.getElementById('signalView');
            const errorView = document.getElementById('errorView');
            let attempts = 0;
            const maxAttempts = 40;
            const checkInterval = setInterval(() => {
                attempts++;
                const isSuccess = (
                    (signalView && signalView.classList && signalView.classList.contains('active')) ||
                    (document.querySelector('#signalView.active')) ||
                    (document.querySelector('[class*="signal"]') && 
                     document.querySelector('[class*="signal"]').textContent && 
                     document.querySelector('[class*="signal"]').textContent.includes('✅'))
                );
                if (isSuccess && !signalSent) {
                    clearInterval(checkInterval);
                    signalSent = true;
                    signalSuccess = true;
                    window.parent.postMessage({ type: 'signalResult', success: true }, '*');
                    return;
                }
                const isFailure = (
                    (errorView && errorView.classList && errorView.classList.contains('active')) ||
                    (document.querySelector('#errorView.active'))
                );
                if (isFailure && !signalSent) {
                    clearInterval(checkInterval);
                    signalSent = true;
                    signalSuccess = false;
                    window.parent.postMessage({ type: 'signalResult', success: false }, '*');
                    return;
                }
                if (attempts >= maxAttempts && !signalSent) {
                    clearInterval(checkInterval);
                    signalSent = true;
                    window.parent.postMessage({ type: 'signalResult', success: false }, '*');
                }
            }, 500);
        }
        
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.type === 'attributes' || mutation.type === 'childList') {
                    const signalView = document.getElementById('signalView');
                    const errorView = document.getElementById('errorView');
                    if (signalView && signalView.classList && signalView.classList.contains('active') && !signalSent) {
                        signalSent = true;
                        signalGenerated = true;
                        signalSuccess = true;
                        window.parent.postMessage({ type: 'signalResult', success: true }, '*');
                    }
                    if (errorView && errorView.classList && errorView.classList.contains('active') && !signalSent) {
                        signalSent = true;
                        signalGenerated = true;
                        signalSuccess = false;
                        window.parent.postMessage({ type: 'signalResult', success: false }, '*');
                    }
                }
            });
        });
        
        setTimeout(() => {
            const targetNode = document.body;
            if (targetNode) {
                observer.observe(targetNode, { attributes: true, childList: true, subtree: true });
            }
        }, 1000);
    <\/script>
    `;
        return htmlContent + injectScript;
    }

    // Update tool header info
    function updateToolHeader() {
        const user = (typeof appState !== 'undefined') ? appState.currentUser : null;
        if (!user) return;
        document.getElementById('toolHeaderUserName').textContent = user.name || user.email.split('@')[0];
        document.getElementById('toolHeaderCredits').textContent = '💰 ' + user.credits;
        document.getElementById('toolHeaderTodayUsed').textContent = '📊 Today: ' + (user.todayUsed || 0);
    }

    // Update switch buttons in header
    function updateSwitchButtons() {
        const container = document.getElementById('toolSwitchContainer');
        if (!container) return;
        container.innerHTML = '';
        const tools = (typeof appState !== 'undefined') ? appState.tools || [] : [];
        const displayTools = openTools.slice(0, 2);
        if (displayTools.length === 0) return;

        displayTools.forEach((toolIdx, slot) => {
            if (tools[toolIdx]) {
                const btn = document.createElement('button');
                btn.className = 'tool-switch-btn';
                btn.textContent = tools[toolIdx].name || 'Tool ' + (slot + 1);
                if (currentToolIndex === toolIdx) {
                    btn.classList.add('active-tool');
                }
                btn.addEventListener('click', function() {
                    if (currentToolIndex !== toolIdx) {
                        switchTool(toolIdx);
                    }
                });
                container.appendChild(btn);
            }
        });
    }

    // Switch between tools
    function switchTool(index) {
        const tools = (typeof appState !== 'undefined') ? appState.tools || [] : [];
        if (!tools[index]) return;
        if (index === currentToolIndex) return;

        saveCurrentToolData();
        currentToolIndex = index;
        localStorage.setItem('brt_current_tool', currentToolIndex);

        const tool = tools[currentToolIndex];
        const iframe = document.getElementById('toolFullscreenIframe');
        const cacheKey = 'tool_' + currentToolIndex;
        let htmlContent = tool.htmlCode || '<div style="text-align:center;padding:40px;color:#FF0033;font-family:Orbitron;"><h2>🎯 Tool</h2><p style="color:#888;font-size:0.8rem;">No HTML code provided.</p></div>';
        if (toolDataCache[cacheKey]) {
            htmlContent = toolDataCache[cacheKey];
        }
        htmlContent = prepareToolHTML(currentToolIndex, htmlContent);
        iframe.srcdoc = htmlContent;
        updateSwitchButtons();
        updateToolHeader();
    }

    // Open tool in fullscreen
    function openToolFullscreen(index) {
        const user = (typeof appState !== 'undefined') ? appState.currentUser : null;
        if (!user) { alert('Please login first!'); return; }
        if (user.blocked) { alert('🚫 Account blocked'); return; }
        if (user.credits < 1) {
            if (typeof openModal === 'function') openModal('noCreditsPopup');
            return;
        }

        const tools = (typeof appState !== 'undefined') ? appState.tools || [] : [];
        const tool = tools[index];
        if (!tool) return;

        sessionStorage.setItem('brt_tool_open', 'true');
        isToolMinimized = false;
        sessionStorage.setItem('brt_tool_minimized', 'false');
        document.getElementById('recentToolsMini').style.display = 'none';

        if (!openTools.includes(index)) {
            if (openTools.length >= 2) openTools.shift();
            openTools.push(index);
            localStorage.setItem('brt_open_tools', JSON.stringify(openTools));
        }

        currentToolIndex = index;
        localStorage.setItem('brt_current_tool', currentToolIndex);
        updateToolHeader();

        const overlay = document.getElementById('toolFullscreen');
        const iframe = document.getElementById('toolFullscreenIframe');
        overlay.classList.add('active');

        const cacheKey = 'tool_' + index;
        let htmlContent = tool.htmlCode || '<div style="text-align:center;padding:40px;color:#FF0033;font-family:Orbitron;"><h2>🎯 Tool</h2><p style="color:#888;font-size:0.8rem;">No HTML code provided.</p></div>';
        if (toolDataCache[cacheKey]) {
            htmlContent = toolDataCache[cacheKey];
        }
        htmlContent = prepareToolHTML(index, htmlContent);
        iframe.srcdoc = htmlContent;

        if (!recentTools.includes(index)) {
            recentTools.unshift(index);
            if (recentTools.length > 5) recentTools.pop();
            localStorage.setItem('brt_recent_tools', JSON.stringify(recentTools));
        }
        updateRecentToolsMini();
        updateSwitchButtons();
    }

    // Save current tool data before switching/closing
    function saveCurrentToolData() {
        if (currentToolIndex === -1) return;
        try {
            const iframe = document.getElementById('toolFullscreenIframe');
            iframe.contentWindow.postMessage({ type: 'saveData', toolIndex: currentToolIndex }, '*');
        } catch(e) {}
    }

    // Update recent tools mini button
    function updateRecentToolsMini() {
        const mini = document.getElementById('recentToolsMini');
        const sub = document.getElementById('recentToolsMiniSub');
        if (recentTools.length === 0) {
            mini.style.display = 'none';
            return;
        }
        const tools = (typeof appState !== 'undefined') ? appState.tools || [] : [];
        const names = recentTools.filter(i => tools[i]).map(i => tools[i].name).join(' • ');
        sub.textContent = names || 'Click to open';
    }

    // Deduct credit on successful signal
    function deductCredit() {
        if (isDeducting) return false;
        isDeducting = true;
        try {
            const user = (typeof appState !== 'undefined') ? appState.currentUser : null;
            if (!user) { isDeducting = false; return false; }
            const creditsToDeduct = (typeof appState !== 'undefined') ? appState.creditsPerSignal || 1 : 1;
            if (user.credits < creditsToDeduct) { isDeducting = false; return false; }
            user.credits -= creditsToDeduct;
            user.signalsUsed = (user.signalsUsed || 0) + 1;
            user.todayUsed = (user.todayUsed || 0) + 1;
            user.totalUsed = (user.totalUsed || 0) + 1;
            if (typeof saveLocalState === 'function') saveLocalState();
            if (typeof updateUI === 'function') updateUI();
            updateToolHeader();
            isDeducting = false;
            return true;
        } catch(e) {
            isDeducting = false;
            return false;
        }
    }

    // Listen for messages from iframe
    window.addEventListener('message', function(event) {
        if (event.data && event.data.type === 'signalResult') {
            if (isDeducting) return;
            if (event.data.success === true) {
                const success = deductCredit();
                if (success) {
                    document.getElementById('toolFullscreenIframe').contentWindow.postMessage({
                        type: 'signalResult',
                        success: true,
                        credits: (typeof appState !== 'undefined' && appState.currentUser) ? appState.currentUser.credits : 0
                    }, '*');
                }
            } else {
                document.getElementById('toolFullscreenIframe').contentWindow.postMessage({
                    type: 'signalResult',
                    success: false,
                    error: event.data.error || 'Signal generation failed'
                }, '*');
            }
            return;
        }
        if (event.data && event.data.type === 'saveToolData') {
            const cacheKey = 'tool_' + event.data.toolIndex;
            toolDataCache[cacheKey] = event.data.htmlContent;
            localStorage.setItem('brt_tool_cache', JSON.stringify(toolDataCache));
        }
    });

    // Recent tools mini click
    document.getElementById('recentToolsMini').addEventListener('click', function() {
        if (recentTools.length === 0) return;
        const lastTool = recentTools[0];
        const tools = (typeof appState !== 'undefined') ? appState.tools || [] : [];
        if (tools[lastTool]) {
            const user = (typeof appState !== 'undefined') ? appState.currentUser : null;
            if (!user) { alert('Please login first!'); return; }
            if (user.blocked) { alert('🚫 Account blocked'); return; }
            if (user.credits < 1) {
                if (typeof openModal === 'function') openModal('noCreditsPopup');
                return;
            }
            openToolFullscreen(lastTool);
        }
    });

    // Close tool fullscreen
    document.getElementById('toolFullscreenClose').addEventListener('click', function() {
        saveCurrentToolData();
        document.getElementById('toolFullscreen').classList.remove('active');
        isToolMinimized = true;
        sessionStorage.setItem('brt_tool_minimized', 'true');
        sessionStorage.removeItem('brt_tool_open');
        if (recentTools.length > 0) {
            document.getElementById('recentToolsMini').style.display = 'block';
            updateRecentToolsMini();
        }
    });

    // Expose functions globally
    window.openToolFullscreen = openToolFullscreen;
    window.updateToolHeader = updateToolHeader;
    window.updateSwitchButtons = updateSwitchButtons;
    window.updateRecentToolsMini = updateRecentToolsMini;
    window.prepareToolHTML = prepareToolHTML;
    window.switchTool = switchTool;
    window.deductCredit = deductCredit;
</script>
