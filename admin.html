<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Binary Ruthless Trader - Admin</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:opsz,wght@14..32,300;400;600;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js",
                "firebase/database": "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js",
                "firebase/analytics": "https://www.gstatic.com/firebasejs/12.16.0/firebase-analytics.js"
            }
        }
    </script>
    
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --text-primary: #ffffff;
            --text-secondary: #aaa;
            --text-muted: #666;
            --border-color: rgba(255,0,51,0.2);
            --shadow-color: rgba(255,0,51,0.08);
            --input-bg: rgba(255,255,255,0.05);
            --container-bg: rgba(255,0,51,0.04);
            --container-border: rgba(255,0,51,0.2);
            --social-icon-bg: rgba(255,255,255,0.02);
            --social-icon-border: rgba(255,0,51,0.08);
            --brand-tagline-color: #888;
            --section-bg: rgba(255,255,255,0.02);
            --section-border: rgba(255,0,51,0.06);
            --nav-link-color: #aaa;
            --nav-link-bg: rgba(255,255,255,0.02);
            --nav-link-border: rgba(255,0,51,0.08);
            --popup-bg: rgba(20,20,20,0.97);
            --popup-border: rgba(255,0,51,0.2);
            --popup-label: #FFD700;
            --overlay-bg: rgba(0,0,0,0.85);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; min-height: 100vh; background: var(--bg-primary); color: var(--text-primary); font-family: 'Inter', sans-serif; overflow-y: auto; overflow-x: hidden; touch-action: manipulation; }
        input, select, button, textarea { font-size: 16px !important; -webkit-text-size-adjust: 100% !important; }
        * { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
        
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: rgba(255, 0, 51, 0.03); }
        ::-webkit-scrollbar-thumb { background: #FF0033; border-radius: 4px; }
        
        .app { width: 100%; min-height: 100vh; display: flex; flex-direction: column; background: var(--bg-primary); position: relative; }
        .app::before { content: ''; position: fixed; top: -30%; left: -20%; width: 80%; height: 80%; background: radial-gradient(circle, rgba(255, 0, 51, 0.04) 0%, transparent 70%); border-radius: 50%; animation: orbFloat 18s ease-in-out infinite alternate; pointer-events: none; z-index: 0; }
        .app::after { content: ''; position: fixed; bottom: -30%; right: -20%; width: 80%; height: 80%; background: radial-gradient(circle, rgba(255, 215, 0, 0.03) 0%, transparent 70%); border-radius: 50%; animation: orbFloat 22s ease-in-out infinite alternate-reverse; pointer-events: none; z-index: 0; }
        @keyframes orbFloat { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(60px, 40px) scale(1.2); } }
        
        .scroll-content { flex: 1; display: flex; flex-direction: column; padding: 0 20px; position: relative; z-index: 1; }
        
        .red-container { background: var(--container-bg); border: 2px solid var(--container-border); border-radius: 18px; padding: 4px 12px 3px 12px; margin: 6px 0 4px; transition: all 0.3s ease; position: relative; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 4px; }
        .red-container:hover { border-color: rgba(255, 0, 51, 0.5); box-shadow: 0 0 30px var(--shadow-color); }
        
        .fb-status-dot-sm { width: 7px; height: 7px; border-radius: 50%; display: inline-block; transition: all 0.3s ease; flex-shrink: 0; }
        .fb-status-dot-sm.green { background: #00FF66; box-shadow: 0 0 14px rgba(0,255,102,0.6); animation: dotPulse 2s ease-in-out infinite; }
        .fb-status-dot-sm.red { background: #FF0033; box-shadow: 0 0 14px rgba(255,0,51,0.6); animation: pulseRed 1.5s ease-in-out infinite; }
        @keyframes pulseRed { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.85); } }
        @keyframes dotPulse { 0%, 100% { box-shadow: 0 0 14px rgba(0,255,102,0.6); } 50% { box-shadow: 0 0 28px rgba(0,255,102,0.9), 0 0 50px rgba(0,255,102,0.2); } }
        
        .brand-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .logo-icon-sm { font-size: 1.4rem; color: #FF0033; text-shadow: 0 0 30px rgba(255,0,51,0.2); animation: pulseLogo 3s ease-in-out infinite; transition: all 0.4s ease; }
        .logo-img-sm { max-height: 1.4rem; max-width: 60px; object-fit: contain; display: none; transition: all 0.4s ease; }
        @keyframes pulseLogo { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.02); opacity: 0.85; } }
        
        .brand-name-sm { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: clamp(0.7rem, 1.3vw, 1.1rem); letter-spacing: 1px; white-space: nowrap; }
        .brand-name-sm .binary { color: var(--text-primary); }
        .brand-name-sm .ruthless { color: #FF0033 !important; }
        .brand-name-sm .trader { color: var(--text-primary); }
        
        .social-icons-header { display: flex; gap: 8px; align-items: center; }
        .social-icons-header a { display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; background: var(--social-icon-bg); border: 1.5px solid var(--social-icon-border); color: var(--text-secondary); font-size: 0.65rem; text-decoration: none; transition: all 0.3s ease; }
        .social-icons-header a:hover { color: #FF0033; border-color: #FF0033; transform: translateY(-2px); box-shadow: 0 6px 30px rgba(255, 0, 51, 0.25); }
        
        .nav-links { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
        .nav-links button { padding: 1px 8px; border-radius: 12px; border: 1px solid var(--nav-link-border); background: var(--nav-link-bg); color: var(--nav-link-color); font-size: 0.4rem; font-weight: 600; cursor: pointer; transition: all 0.3s ease; font-family: 'Inter', sans-serif; letter-spacing: 0.3px; white-space: nowrap; }
        .nav-links button:hover { border-color: #FF0033; color: #fff; background: rgba(255,0,51,0.08); }
        .nav-links .logout-btn { border-color: rgba(255,0,51,0.2); color: #FF0033; }
        .nav-links .logout-btn:hover { background: rgba(255,0,51,0.12); box-shadow: 0 0 20px rgba(255,0,51,0.08); }
        
        .admin-dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin: 6px 0 12px 0; }
        .admin-dash-card { background: rgba(255,255,255,0.03); border: 1px solid var(--section-border); border-radius: 14px; padding: 14px 12px; text-align: center; cursor: pointer; transition: all 0.3s ease; position: relative; overflow: hidden; }
        .admin-dash-card:hover { border-color: #FF0033; transform: translateY(-3px); box-shadow: 0 10px 32px rgba(255,0,51,0.08); }
        .admin-dash-card .icon { font-size: 1.4rem; color: #FFD700; display: block; margin-bottom: 2px; transition: all 0.3s ease; }
        .admin-dash-card .count { font-family: 'Roboto Mono', monospace; font-size: 1.5rem; font-weight: 700; display: block; margin: 2px 0; }
        .admin-dash-card .count.green { color: #00FF66; }
        .admin-dash-card .count.red { color: #FF0033; }
        .admin-dash-card .count.gold { color: #FFD700; }
        .admin-dash-card .label { font-size: 0.5rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; }
        
        .cursor-glow { position: fixed; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, rgba(255,0,51,0.04), transparent 70%); pointer-events: none; z-index: 0; transform: translate(-50%, -50%); transition: opacity 0.3s ease; opacity: 0; }
        .cursor-glow.active { opacity: 1; }
        @media (hover: none) { .cursor-glow { display: none !important; } }
        
        @media (max-width: 768px) {
            .scroll-content { padding: 0 12px; }
            .red-container { padding: 3px 8px 2px 8px; border-radius: 14px; }
            .admin-dash-card { padding: 10px 8px; }
        }
        @media (max-width: 480px) {
            .brand-name-sm { font-size: 0.6rem; }
            .red-container { padding: 2px 6px 1px 6px; border-radius: 12px; margin: 4px 0 3px; }
        }
    </style>
</head>
<body>

<div class="app">
    <div class="scroll-content">
        
        <div class="red-container">
            <div class="brand-left">
                <span class="logo-icon-sm" id="adminLogoIcon">◆</span>
                <img class="logo-img-sm" id="adminLogoImage" alt="Logo" style="display:none;" />
                <span class="brand-name-sm">
                    <span class="binary">BINARY</span>
                    <span class="ruthless">RUTHLESS</span>
                    <span class="trader">TRADER</span>
                </span>
                <span class="fb-status-dot-sm red" id="adminStatusDot"></span>
            </div>
            
            <div class="social-icons-header" id="adminSocialIcons">
                <a href="#"><i class="fab fa-telegram-plane"></i></a>
                <a href="#"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-youtube"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
            </div>
            
            <div class="nav-links">
                <button onclick="window.location.href='index.html'">🏠 Home</button>
                <button onclick="window.location.href='dashboard.html'">📊 Dashboard</button>
                <button class="logout-btn" id="adminLogoutBtn">🚪 Logout</button>
            </div>
        </div>
        
        <div id="adminDashboard">
            <div class="admin-dash-grid">
                <div class="admin-dash-card" onclick="if(typeof openPendingPaymentsPopup==='function')openPendingPaymentsPopup()">
                    <span class="icon">💳</span>
                    <span class="count green" id="pendingPaymentsCount">0</span>
                    <span class="label">Pending Payments</span>
                </div>
                <div class="admin-dash-card" onclick="if(typeof openPendingVerificationsPopup==='function')openPendingVerificationsPopup()">
                    <span class="icon">✅</span>
                    <span class="count green" id="pendingVerificationsCount">0</span>
                    <span class="label">Pending Verifications</span>
                </div>
                <div class="admin-dash-card" onclick="if(typeof openUsersPopup==='function')openUsersPopup()">
                    <span class="icon">👤</span>
                    <span class="count gold" id="verifiedUsersCount">0</span>
                    <span class="label">Verified Users</span>
                </div>
                <div class="admin-dash-card" onclick="if(typeof openChatPopup==='function')openChatPopup()">
                    <span class="icon">💬</span>
                    <span class="count green" id="chatNotificationCount">0</span>
                    <span class="label">Chat Messages</span>
                </div>
            </div>
        </div>
        
        <div id="adminArea">
            <!-- Modules will be loaded here -->
            <!-- admin-offers-manager.html -->
            <!-- admin-payments-manager.html -->
            <!-- admin-credit-packs-manager.html -->
            <!-- admin-credit-per-signal.html -->
            <!-- admin-broker-manager.html -->
            <!-- admin-tools-manager.html -->
            <!-- admin-social-media-manager.html -->
            <!-- admin-features-manager.html -->
            <!-- admin-logo-and-admin-login-clicks.html -->
            <!-- admin-change-password.html -->
            <!-- admin-revenue.html -->
        </div>
        
    </div>
</div>

<div class="cursor-glow" id="cursorGlow"></div>

<!-- ─── LOAD MODULES ─── -->
<script src="firebase-config.js"></script>
<script src="security.js"></script>
<script src="admin-password-popup.html"></script>
<script src="admin-pending-payments.html"></script>
<script src="admin-pending-verifications.html"></script>
<script src="admin-verified-users.html"></script>
<script src="admin-chat.html"></script>
<script src="admin-revenue.html"></script>
<script src="admin-offers-manager.html"></script>
<script src="admin-payments-manager.html"></script>
<script src="admin-credit-per-signal.html"></script>
<script src="admin-credit-packs-manager.html"></script>
<script src="admin-broker-manager.html"></script>
<script src="admin-tools-manager.html"></script>
<script src="admin-social-media-manager.html"></script>
<script src="admin-features-manager.html"></script>
<script src="admin-logo-and-admin-login-clicks.html"></script>
<script src="admin-change-password.html"></script>

<script>
    // ─── MAIN ADMIN JS ───

    // Apply Admin Logo
    function applyAdminLogo(logoBase64) {
        const icon = document.getElementById('adminLogoIcon');
        const img = document.getElementById('adminLogoImage');
        if (logoBase64 && logoBase64 !== '') {
            icon.style.display = 'none';
            img.src = logoBase64;
            img.style.display = 'block';
        } else {
            icon.style.display = 'block';
            img.style.display = 'none';
        }
    }

    // Render Admin Social Media
    function renderAdminSocialMedia() {
        const container = document.getElementById('adminSocialIcons');
        if (!container) return;
        let socials = (typeof appState !== 'undefined') ? appState.socialMedia || [] : [];
        const visibleSocials = socials.filter(s => s.visibility === 'visible');
        if (visibleSocials.length === 0) {
            container.innerHTML = `
                <a href="#"><i class="fab fa-telegram-plane"></i></a>
                <a href="#"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-youtube"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
            `;
            return;
        }
        container.innerHTML = '';
        visibleSocials.forEach(social => {
            const a = document.createElement('a');
            a.href = social.url || '#';
            a.target = '_blank';
            a.title = social.name || 'Link';
            a.innerHTML = `<i class="${social.icon || 'fas fa-link'}"></i>`;
            a.addEventListener('click', function(e) {
                if (social.url === '#') { e.preventDefault(); alert('📱 ' + social.name + ' - Configure URL in Admin'); }
            });
            container.appendChild(a);
        });
    }

    // Update Pending Counts
    function updatePendingCounts() {
        if (typeof appState === 'undefined') return;
        const payments = appState.payments || [];
        const pendingPayments = payments.filter(p => p.status === 'pending');
        document.getElementById('pendingPaymentsCount').textContent = pendingPayments.length;
        document.getElementById('pendingPaymentsCount').className = 'count ' + (pendingPayments.length > 0 ? 'red' : 'green');
        
        const requests = appState.verificationRequests || [];
        const pendingVerifications = requests.filter(r => r.status === 'pending');
        document.getElementById('pendingVerificationsCount').textContent = pendingVerifications.length;
        document.getElementById('pendingVerificationsCount').className = 'count ' + (pendingVerifications.length > 0 ? 'red' : 'green');
        
        const verifiedUsers = appState.users.filter(u => u.verified === true);
        document.getElementById('verifiedUsersCount').textContent = verifiedUsers.length;
        document.getElementById('verifiedUsersCount').className = 'count gold';
    }

    // Update UI
    function updateUI() {
        if (typeof appState === 'undefined') return;
        if (appState.offerName) {
            const offerNameEl = document.getElementById('offerName');
            if (offerNameEl) offerNameEl.value = appState.offerName;
        }
        if (appState.offerDescription) {
            const offerDescEl = document.getElementById('offerDescription');
            if (offerDescEl) offerDescEl.value = appState.offerDescription;
        }
    }

    // Admin Logout
    document.getElementById('adminLogoutBtn').addEventListener('click', function() {
        sessionStorage.removeItem('admin_logged_in');
        sessionStorage.removeItem('user_logged_in');
        window.location.href = 'index.html';
    });

    // Cursor Glow
    const glow = document.getElementById('cursorGlow');
    if (window.matchMedia('(hover: hover)').matches) {
        document.addEventListener('mousemove', (e) => { glow.style.left = e.clientX + 'px'; glow.style.top = e.clientY + 'px'; glow.classList.add('active'); });
        document.addEventListener('mouseleave', () => glow.classList.remove('active'));
    }

    // Escape Key
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            document.querySelectorAll('.overlay.active').forEach(el => el.classList.remove('active'));
        }
    });

    // Init
    document.addEventListener('DOMContentLoaded', function() {
        if (typeof loadLocalState === 'function') loadLocalState();
        renderAdminSocialMedia();
        updatePendingCounts();
        updateUI();
        if (typeof renderRevenueStats === 'function') renderRevenueStats();
        console.log('⚙️ Admin Panel Loaded');
    });

    // Expose Globally
    window.applyAdminLogo = applyAdminLogo;
    window.renderAdminSocialMedia = renderAdminSocialMedia;
    window.updatePendingCounts = updatePendingCounts;
    window.updateUI = updateUI;
</script>
</body>
</html>
