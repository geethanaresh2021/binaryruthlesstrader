<style>
    /* ─── OFFERS MANAGER CSS ─── */
    .admin-section {
        border: 1px solid rgba(255,0,51,0.06);
        border-radius: 12px;
        padding: 14px 16px;
        margin-bottom: 10px;
        background: rgba(255,255,255,0.02);
        transition: all 0.3s ease;
        cursor: default;
    }
    .admin-section:hover {
        border-color: rgba(255, 0, 51, 0.3);
        box-shadow: 0 0 24px rgba(255,0,51,0.08);
    }
    .admin-section h4 {
        color: #FFD700;
        font-size: 0.7rem;
        margin-bottom: 10px;
        font-family: 'Orbitron', sans-serif;
        letter-spacing: 1px;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .admin-section .field-group {
        margin-bottom: 8px;
    }
    .admin-section .field-group label {
        font-size: 0.5rem;
        color: #aaa;
        display: block;
        margin-bottom: 3px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-weight: 600;
    }
    .admin-section .field-group input,
    .admin-section .field-group textarea {
        width: 100%;
        padding: 7px 12px;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,0,51,0.1);
        border-radius: 6px;
        color: #ffffff;
        font-family: 'Inter', sans-serif;
        font-size: 0.7rem;
        outline: none;
        transition: all 0.3s ease;
    }
    .admin-section .field-group input:focus,
    .admin-section .field-group textarea:focus {
        border-color: #FF0033;
        box-shadow: 0 0 16px rgba(255,0,51,0.03);
    }
    .admin-section .field-group textarea {
        height: 50px;
        resize: vertical;
    }
    .admin-section .field-group input:disabled,
    .admin-section .field-group textarea:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }
    .admin-section .btn-row {
        display: flex;
        gap: 8px;
        margin-top: 6px;
    }
    .admin-section .btn-row .btn-edit {
        flex: 1;
        padding: 7px;
        border-radius: 6px;
        font-weight: 700;
        border: none;
        cursor: pointer;
        transition: all 0.3s ease;
        font-family: 'Inter', sans-serif;
        font-size: 0.55rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        background: #ffffff;
        color: #000000;
    }
    .admin-section .btn-row .btn-edit:hover {
        box-shadow: 0 0 24px rgba(255,255,255,0.15);
        transform: scale(1.02);
    }
    .admin-section .btn-row .btn-edit:active {
        transform: scale(0.95);
    }
    .admin-section .btn-row .btn-save {
        flex: 1;
        padding: 7px;
        border-radius: 6px;
        font-weight: 700;
        border: none;
        cursor: pointer;
        transition: all 0.3s ease;
        font-family: 'Inter', sans-serif;
        font-size: 0.55rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        background: #FF0033;
        color: #ffffff;
        display: none;
    }
    .admin-section .btn-row .btn-save:hover {
        box-shadow: 0 0 24px rgba(255,0,51,0.2);
        transform: scale(1.02);
    }
    .admin-section .btn-row .btn-save:active {
        transform: scale(0.95);
    }
    .admin-section .btn-row .btn-save.show {
        display: block;
    }

    /* ─── MOBILE ─── */
    @media (max-width: 480px) {
        .admin-section {
            padding: 10px 12px;
            border-radius: 10px;
        }
        .admin-section h4 {
            font-size: 0.6rem;
        }
    }
</style>

<!-- ─── OFFER SETTINGS HTML ─── -->
<div class="admin-section" style="border-color:rgba(255,215,0,0.15);">
    <h4 style="color:#FFD700;">🎁 Offer Settings</h4>
    <div class="field-group">
        <label>Offer Name</label>
        <input type="text" id="offerName" placeholder="FREE SIGNAL OFFER" disabled>
    </div>
    <div class="field-group">
        <label>Offer Description</label>
        <textarea id="offerDescription" placeholder="Get 10 FREE signals..." disabled></textarea>
    </div>
    <div class="btn-row">
        <button class="btn-edit" onclick="enableOfferEdit(this)">✏️ Edit</button>
        <button class="btn-save" onclick="adminSaveOffer()">💾 Save</button>
    </div>
</div>

<script>
    // ─── OFFERS MANAGER FUNCTIONS ───

    // Enable Edit Mode
    function enableOfferEdit(btn) {
        const section = btn.closest('.admin-section');
        if (!section) return;
        section.querySelectorAll('input, textarea').forEach(i => i.disabled = false);
        section.querySelectorAll('.btn-save').forEach(b => b.classList.add('show'));
        btn.style.display = 'none';
    }

    // Disable Edit Mode
    function disableOfferEdit(section) {
        if (!section) return;
        section.querySelectorAll('input, textarea').forEach(i => i.disabled = true);
        section.querySelectorAll('.btn-save').forEach(b => b.classList.remove('show'));
        section.querySelectorAll('.btn-edit').forEach(b => {
            b.style.display = 'block';
            b.textContent = '✏️ Edit';
        });
    }

    // Save Offer Settings
    function adminSaveOffer() {
        const name = document.getElementById('offerName').value.trim() || 'FREE SIGNAL OFFER';
        const description = document.getElementById('offerDescription').value.trim() || 'Get 10 FREE signals for Quotex, Binomo, Pocket Option when you deposit via our affiliate links!';

        // Extract credits from description
        const numberMatch = description.match(/\d+/);
        if (numberMatch) {
            const credits = parseInt(numberMatch[0]);
            if (!isNaN(credits) && credits > 0) {
                if (typeof appState !== 'undefined') appState.offerCredits = credits;
            }
        }

        if (typeof appState !== 'undefined') {
            appState.offerName = name;
            appState.offerDescription = description;
            if (typeof saveLocalState === 'function') saveLocalState();
        }

        // Save to localStorage
        localStorage.setItem('brt_offer_credits', (typeof appState !== 'undefined') ? appState.offerCredits : 10);

        // Disable fields
        const section = document.getElementById('offerName').closest('.admin-section');
        disableOfferEdit(section);

        // Show saved message
        const btn = document.getElementById('offerName').closest('.admin-section').querySelector('.btn-save');
        if (btn) {
            btn.textContent = '✅ Saved';
            setTimeout(() => { btn.textContent = '💾 Save'; }, 2000);
        }
    }

    // Load Offer Data
    function loadOfferSettings() {
        if (typeof appState !== 'undefined') {
            if (appState.offerName) document.getElementById('offerName').value = appState.offerName;
            if (appState.offerDescription) document.getElementById('offerDescription').value = appState.offerDescription;
        }
    }

    // Initialize on load
    document.addEventListener('DOMContentLoaded', function() {
        loadOfferSettings();
    });

    // Expose functions globally
    window.adminSaveOffer = adminSaveOffer;
    window.enableOfferEdit = enableOfferEdit;
    window.loadOfferSettings = loadOfferSettings;
</script>
