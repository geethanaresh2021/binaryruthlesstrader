<!-- Contains: HTML + CSS + JS for Credits Display -->

<style>
    /* ─── CREDITS CONTAINER CSS ─── */
    .credits-container {
        background: rgba(0,255,102,0.02);
        border: 2px solid rgba(0,255,102,0.06);
        border-radius: 12px;
        padding: 6px 14px;
        margin: 2px 0 4px;
        display: flex;
        align-items: center;
        justify-content: space-around;
        flex-wrap: wrap;
        gap: 4px;
        transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .credits-container:hover {
        border-color: rgba(0,255,102,0.2);
        transform: scale(1.01);
    }
    .credits-container .credit-item {
        text-align: center;
    }
    .credits-container .credit-item .number {
        font-family: 'Roboto Mono', monospace;
        font-size: clamp(1.2rem, 1.8vw, 1.8rem);
        font-weight: 700;
        color: #FFD700;
    }
    .credits-container .credit-item .label {
        font-size: 0.55rem;
        color: #aaa;
        text-transform: uppercase;
        letter-spacing: 1px;
        display: block;
    }
    .credits-container .credit-item .number.green {
        color: #00FF66;
    }

    /* ─── MOBILE ─── */
    @media (max-width: 768px) {
        .credits-container {
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: space-around;
            gap: 4px;
        }
        .credits-container .credit-item {
            flex: 1;
            min-width: 80px;
        }
    }
    @media (max-width: 480px) {
        .credits-container .credit-item .number {
            font-size: 0.95rem;
        }
        .credits-container .credit-item .label {
            font-size: 0.4rem;
        }
    }
</style>

<!-- ─── CREDITS CONTAINER HTML ─── -->
<div class="credits-container" id="creditsContainer">
    <div class="credit-item">
        <span class="number green" id="dashCredits">0</span>
        <span class="label">Available Credits</span>
    </div>
    <div class="credit-item">
        <span class="number" id="dashTodayUsed">0</span>
        <span class="label">Today Used</span>
    </div>
</div>

<script>
    // ─── CREDITS FUNCTIONS ───

    // Update credits display
    function updateCreditsDisplay() {
        const user = (typeof appState !== 'undefined') ? appState.currentUser : null;
        if (user) {
            document.getElementById('dashCredits').textContent = user.credits || 0;
            document.getElementById('dashTodayUsed').textContent = user.todayUsed || 0;
        }
    }

    // Reset today used at midnight
    function resetTodayUsed() {
        const now = new Date();
        const lastReset = localStorage.getItem('lastResetDate');
        const today = now.toDateString();
        if (lastReset !== today) {
            if (typeof appState !== 'undefined' && appState.users) {
                appState.users.forEach(u => {
                    u.todayUsed = 0;
                });
            }
            localStorage.setItem('lastResetDate', today);
            if (typeof saveLocalState === 'function') saveLocalState();
            updateCreditsDisplay();
        }
    }

    // Expose functions globally
    window.updateCreditsDisplay = updateCreditsDisplay;
    window.resetTodayUsed = resetTodayUsed;
</script>
