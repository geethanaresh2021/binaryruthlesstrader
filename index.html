        /* ─── RESET & BASE ─── */

        }
        body {
            -webkit-user-select: none;
            -moz-user-select: none;

        /* ─── SCROLLBAR ─── */

        /* ─── APP ─── */
        .app {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            position: relative;
            overflow: hidden;
            transition: background 0.4s ease;
        }
        .app::before {
            content: '';
            position: fixed;
            top: -30%;
            left: -20%;
            width: 80%;
            height: 80%;
            background: radial-gradient(circle, rgba(255, 0, 51, 0.04) 0%, transparent 70%);
            border-radius: 50%;
            animation: orbFloat 18s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 0;
        }
        .app::after {
            content: '';
            position: fixed;
            bottom: -30%;
            right: -20%;
            width: 80%;
            height: 80%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.03) 0%, transparent 70%);
            border-radius: 50%;
            animation: orbFloat 22s ease-in-out infinite alternate-reverse;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes orbFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(60px, 40px) scale(1.2);
            }
        }

        .scroll-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0 20px;
            position: relative;
            z-index: 1;
        }

        /* ─── RED CONTAINER ─── COMPACT ─── */
        .red-container {
            background: var(--container-bg);
            border: 2px solid var(--container-border);
            border-radius: 18px;
            padding: 4px 12px 3px 12px;
            margin: 6px 0 4px;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            will-change: transform;
        }
        .red-container:hover {
            border-color: rgba(255, 0, 51, 0.5);
            box-shadow: 0 0 60px var(--shadow-color);
            transform: scale(1.012) translateY(-1px);
        }
        .red-container::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 18px;
            padding: 2px;
            background: linear-gradient(135deg, transparent, rgba(255, 0, 51, 0.15), transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        .red-container:hover::after {
            opacity: 1;
        }

        /* status dot */
        .fb-status-dot {
            position: absolute;
            top: 4px;
            left: 8px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            display: inline-block;
            transition: all 0.3s ease;
            z-index: 5;
        }
        .fb-status-dot.green {
            background: #00FF66;
            box-shadow: 0 0 14px rgba(0, 255, 102, 0.6);
            animation: dotPulse 2s ease-in-out infinite;
        }
        .fb-status-dot.red {
            background: #FF0033;
            box-shadow: 0 0 14px rgba(255, 0, 51, 0.6);
            animation: pulseRed 1.5s ease-in-out infinite;
        }
        @keyframes pulseRed {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.3;
                transform: scale(0.85);
            }

        @keyframes dotPulse {
            0%,
            100% {
                box-shadow: 0 0 14px rgba(0, 255, 102, 0.6);
            }
            50% {
                box-shadow: 0 0 28px rgba(0, 255, 102, 0.9), 0 0 50px rgba(0, 255, 102, 0.2);
            }

        /* ─── BRAND SECTION ─── */
        .brand-section {
            text-align: center;
            padding: 2px 0 1px 0;
            flex-shrink: 0;
            cursor: pointer;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;

        }

        .logo-wrapper {
            position: relative;

        }

        /* Logo glow – ONLY on home page */
        .logo-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: clamp(140px, 28vw, 300px);
            height: clamp(140px, 28vw, 300px);
            transform: translate(-50%, -50%) scale(0.5);
            background: radial-gradient(circle, rgba(255, 0, 51, 0.6) 0%, rgba(255, 0, 51, 0.2) 40%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(35px);
            opacity: 0;
            transition: opacity 0.5s ease, transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .logo-glow.active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            animation: glowFlash 0.7s ease forwards;
        }
        @keyframes glowFlash {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.3);
            }
            30% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.2);
            }
            70% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.7);
            }
        }

        .brand-section>* {
            position: relative;
            z-index: 1;
        }

        .brand-section:active .logo-icon {
            animation: zoomInSlow 0.7s ease forwards;
        }
        .brand-section:active .logo-img {
            animation: zoomInSlow 0.7s ease forwards;
        }
        .brand-section:active .brand-name {
            animation: zoomOutSlow 0.7s ease forwards;
        }

        @keyframes zoomInSlow {
            0% {
                transform: scale(1);
            }
            40% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
            }
        }
        @keyframes zoomOutSlow {
            0% {
                transform: scale(1);
            }
            40% {
                transform: scale(0.8);
            }
            100% {
                transform: scale(1);
            }
        }

        .logo-icon {
            font-size: clamp(3rem, 6vw, 5.2rem);

            z-index: 2;
        }
        .brand-section:hover .logo-icon {

            transform: scale(1.03) rotate(-1deg);
        }
        .logo-img {
            max-height: clamp(3rem, 6vw, 5.2rem);
            max-width: 220px;

        /* ─── SOCIAL ICONS ─── */
        .social-icons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 3px;
            flex-wrap: wrap;
            position: relative;
            z-index: 2;
        }
        .social-icons a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--social-icon-bg);
            border: 1.5px solid var(--social-icon-border);
            color: var(--text-secondary);
            font-size: 0.75rem;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            animation: socialGlow 2s ease-in-out infinite;
        }
        .social-icons a:nth-child(1) { animation-delay: 0s; }
        .social-icons a:nth-child(2) { animation-delay: 0.4s; }
        .social-icons a:nth-child(3) { animation-delay: 0.8s; }
        .social-icons a:nth-child(4) { animation-delay: 1.2s; }

        @keyframes socialGlow {
            0%, 100% {
                border-color: rgba(255, 0, 51, 0.15);
                box-shadow: 0 0 10px rgba(255, 0, 51, 0.05);
            }
            50% {
                border-color: rgba(255, 0, 51, 0.8);
                box-shadow: 0 0 25px rgba(255, 0, 51, 0.3), 0 0 50px rgba(255, 0, 51, 0.1);
            }
        }

        .social-icons a::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle at center, rgba(255, 0, 51, 0.15), transparent 70%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .social-icons a:hover {
            color: #FF0033;
            border-color: #FF0033;
            transform: translateY(-2px) scale(1.15);
            box-shadow: 0 6px 30px rgba(255, 0, 51, 0.25);
            animation-play-state: paused;
        }
        .social-icons a:hover::before {
            opacity: 1;
        }
        .social-icons a:active {
            transform: scale(0.9);
        }

            border: 3px solid var(--offer-banner-border);
            border-radius: 20px;
            padding: 28px 32px;
            text-align: center;
            margin: 6px 0 10px;
            flex-shrink: 0;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            isolation: isolate;
            will-change: transform;
        }
        .offer-banner::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.05), transparent 50%, rgba(255, 0, 51, 0.05));
            opacity: 0;
            transition: opacity 0.6s ease;
            z-index: 0;
        }
        .offer-banner:hover {
            border-color: #FFD700;
            box-shadow: 0 0 80px rgba(255, 215, 0, 0.1), inset 0 0 80px rgba(255, 215, 0, 0.03);
            transform: scale(1.03) translateY(-3px);
        }
        .offer-banner:hover::before {
            opacity: 1;
        }
        .offer-banner:active {
            transform: scale(0.98);
        }
        
        /* ─── OFFER TITLE WITH 3D GIFT BOX ─── */
        .offer-title-wrapper {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
        .offer-gift-icon {
            font-size: clamp(1.6rem, 2.5vw, 2.4rem);
            display: inline-block;
            animation: gift3D 2.5s ease-in-out infinite;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.25));
            transform-style: preserve-3d;
        }
        .offer-gift-icon:nth-child(1) { animation-delay: 0s; }
        .offer-gift-icon:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes gift3D {
            0% {
                transform: translateY(0) scale(1) rotateY(0deg) rotateX(0deg);
                filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.25));
            }
            15% {
                transform: translateY(-6px) scale(1.08) rotateY(15deg) rotateX(5deg);
                filter: drop-shadow(0 8px 30px rgba(255, 215, 0, 0.5));
            }
            30% {
                transform: translateY(-2px) scale(0.95) rotateY(-10deg) rotateX(-3deg);
                filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.3));
            }
            50% {
                transform: translateY(-8px) scale(1.12) rotateY(20deg) rotateX(8deg);
                filter: drop-shadow(0 12px 40px rgba(255, 215, 0, 0.6));
            }
            70% {
                transform: translateY(2px) scale(0.98) rotateY(-5deg) rotateX(-2deg);
                filter: drop-shadow(0 2px 25px rgba(255, 215, 0, 0.35));
            }
            85% {
                transform: translateY(-4px) scale(1.05) rotateY(8deg) rotateX(3deg);
                filter: drop-shadow(0 6px 35px rgba(255, 215, 0, 0.45));
            }
            100% {
                transform: translateY(0) scale(1) rotateY(0deg) rotateX(0deg);
                filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.25));
            }
        }

        .offer-banner h4 {
            color: #FFD700;
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.3rem, 2vw, 1.8rem);
            letter-spacing: 2px;
            position: relative;
            z-index: 1;
            font-weight: 700;
            display: inline-block;
            animation: offerNameZoom 2s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.1);
        }
        
        @keyframes offerNameZoom {
            0%, 100% {
                transform: scale(1);
                text-shadow: 0 0 30px rgba(255, 215, 0, 0.1);
            }
            50% {
                transform: scale(1.04);
                text-shadow: 0 0 50px rgba(255, 215, 0, 0.25), 0 0 80px rgba(255, 215, 0, 0.08);
            }
        }

        .offer-banner .offer-description-text {
            color: var(--text-secondary);
            font-size: clamp(1rem, 1.4vw, 1.3rem);
            margin-top: 6px;
            position: relative;
            z-index: 1;
            font-weight: 400;
            line-height: 1.8;
        }
        
        /* ─── 3D CREDIT NUMBER ZOOM EFFECT ─── */
        .offer-banner .highlight {
            color: #FF0033;
            font-weight: 700;
            display: inline-block;
            font-size: clamp(1.4rem, 2vw, 1.8rem);
            text-shadow: 0 0 20px rgba(255, 0, 51, 0.25);
            animation: credit3DZoom 1.8s ease-in-out infinite;
            transform-origin: center;
            position: relative;
            padding: 0 6px;
            line-height: 1.4;
        }
        
        @keyframes credit3DZoom {
            0% {
                transform: scale(1) translateZ(0) rotateX(0deg);
                color: #FF0033;
                text-shadow: 0 0 20px rgba(255, 0, 51, 0.25), 0 0 40px rgba(255, 0, 51, 0.08);
            }
            25% {
                transform: scale(1.25) translateZ(20px) rotateX(5deg);
                color: #FFD700;
                text-shadow: 0 0 40px rgba(255, 215, 0, 0.4), 0 0 60px rgba(255, 215, 0, 0.15);
            }
            50% {
                transform: scale(1.1) translateZ(10px) rotateX(-3deg);
                color: #FF0033;
                text-shadow: 0 0 30px rgba(255, 0, 51, 0.3), 0 0 50px rgba(255, 0, 51, 0.1);
            }
            75% {
                transform: scale(1.2) translateZ(15px) rotateX(4deg);
                color: #FF6600;
                text-shadow: 0 0 35px rgba(255, 100, 0, 0.35), 0 0 55px rgba(255, 215, 0, 0.12);
            }
            100% {
                transform: scale(1) translateZ(0) rotateX(0deg);
                color: #FF0033;
                text-shadow: 0 0 20px rgba(255, 0, 51, 0.25), 0 0 40px rgba(255, 0, 51, 0.08);
            }
        }

        .offer-banner .click-hint {
            color: var(--text-muted);
            font-size: 0.7rem;
            margin-top: 8px;
            letter-spacing: 2px;
            position: relative;
            z-index: 1;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        .offer-banner:hover .click-hint {
            color: var(--text-secondary);
            letter-spacing: 3px;
        }
        .offer-banner::after {
            content: '';
            position: absolute;
            top: -100%;
            left: -100%;
            width: 300%;
            height: 300%;
            background: linear-gradient(45deg, transparent 40%, rgba(255, 215, 0, 0.06) 50%, transparent 60%);
            animation: shimmer 6s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes shimmer {
            0% {
                transform: translateX(-100%) rotate(25deg);
            }
            100% {
                transform: translateX(100%) rotate(25deg);
            }
        }

        /* ─── USER CARDS ─── */
        .user-section {
            display: flex;
            gap: 12px;
            padding: 4px 0;
            flex-shrink: 0;
            flex-wrap: wrap;
            justify-content: center;
        }
        .user-card {
            flex: 1;
            min-width: 150px;
            max-width: 250px;
            backdrop-filter: blur(8px);
            border-radius: 14px;
            padding: 12px 10px 14px;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            will-change: transform;
            cursor: default;
            overflow: hidden;
            background: var(--user-card-bg);
            border: 2px solid var(--border-color);
        }
        .user-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 14px;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }
        .user-card:hover {
            transform: scale(1.035) translateY(-3px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }
        .user-card:hover::before {
            opacity: 1;
        }
        .user-card:active {
            transform: scale(0.97);
        }

        .user-card .icon {
            font-size: 1.3rem;
            display: block;
            margin-bottom: 2px;
            transition: all 0.4s ease;
        }
        .user-card:hover .icon {
            transform: scale(1.12) rotate(-3deg);
        }

        .user-card h3 {
            font-size: 0.65rem;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            color: var(--text-primary);
        }
        .user-card:hover h3 {
            letter-spacing: 2px;
        }

        .user-card p {
            color: var(--text-secondary);
            font-size: 0.55rem;
            margin: 2px 0 5px;
            transition: all 0.3s ease;
        }
        .user-card:hover p {
            color: var(--text-primary);
        }

        .user-card .btn {
            width: 100%;
            padding: 5px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.6rem;
            border: none;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-family: 'Inter', sans-serif;
            position: relative;
            overflow: hidden;
            will-change: transform;
        }
        .user-card .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 30px;
            background: radial-gradient(circle at center, rgba(255, 255, 255, 0.12), transparent 70%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .user-card .btn:hover {
            transform: scale(1.06) translateY(-2px);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.3);
        }
        .user-card .btn:hover::after {
            opacity: 1;
        }
        .user-card .btn:active {
            transform: scale(0.95);
        }

        .user-card.login-card {
            background: var(--user-card-bg);
            border: 2px solid rgba(255, 0, 51, 0.2);
        }
        .user-card.login-card:hover {
            border-color: #FF0033;
            box-shadow: 0 0 40px rgba(255, 0, 51, 0.08), inset 0 0 40px rgba(255, 0, 51, 0.02);
        }
        .user-card.login-card h3 {
            color: #FF0033;
        }
        .user-card.login-card .btn-white {
            background: #fff;
            color: #000;
        }
        .user-card.login-card .btn-white:hover {
            background: #FF0033;
            color: #fff;
            box-shadow: 0 0 28px rgba(255, 0, 51, 0.2);
        }

        .user-card.signup-card {
            background: var(--user-card-bg);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        .user-card.signup-card:hover {
            border-color: rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.06), inset 0 0 40px rgba(255, 255, 255, 0.02);
        }
        .user-card.signup-card h3 {
            color: var(--text-primary);
        }
        .user-card.signup-card .btn-red {
            background: #FF0033;
            color: #fff;
            box-shadow: 0 0 14px rgba(255, 0, 51, 0.15);
        }
        .user-card.signup-card .btn-red:hover {
            background: #ff1a44;
            box-shadow: 0 0 36px rgba(255, 0, 51, 0.3);
            transform: scale(1.06) translateY(-2px);
        }

        .user-card.verify-card {
            background: var(--user-card-bg);
            border: 2px solid rgba(255, 0, 51, 0.2);
        }
        .user-card.verify-card:hover {
            border-color: #FF0033;
            box-shadow: 0 0 40px rgba(255, 0, 51, 0.08), inset 0 0 40px rgba(255, 0, 51, 0.02);
        }
        .user-card.verify-card h3 {
            color: #FF0033;
        }
        .user-card.verify-card .btn-white {
            background: #fff;
            color: #000;
        }
        .user-card.verify-card .btn-white:hover {
            background: #FF0033;
            color: #fff;
            box-shadow: 0 0 28px rgba(255, 0, 51, 0.2);
        }

        .user-card.highlight {
            border-color: #FFD700 !important;
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.1) !important;
            animation: highlightPulse 0.8s ease 3;
        }
        @keyframes highlightPulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.03);
            }
        }

        /* ─── FEATURES ─── */
        .features-section {
            padding: 4px 0 4px;
            border-top: 2px solid var(--border-color);
            border-bottom: 2px solid var(--border-color);
            flex-shrink: 0;
            margin-top: 6px;
        }
        .features-title {
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(0.55rem, 0.8vw, 0.8rem);
            font-weight: 700;
            margin-bottom: 3px;
            transition: all 0.3s ease;
            color: var(--text-primary);
        }
        .features-title .neon {
            color: #FF0033;
            transition: all 0.3s ease;
        }
        .features-title .gold {
            color: #FFD700;
            transition: all 0.3s ease;
        }
        .features-section:hover .features-title .neon {
            text-shadow: 0 0 28px rgba(255, 0, 51, 0.2);
        }
        .features-section:hover .features-title .gold {
            text-shadow: 0 0 28px rgba(255, 215, 0, 0.2);
        }

        .features-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 3px 2px 5px;
            scrollbar-width: thin;
            scrollbar-color: #FF0033 transparent;
            justify-content: center;
            flex-wrap: wrap;
        }
        .features-scroll::-webkit-scrollbar {
            height: 3px;
        }
        .features-scroll::-webkit-scrollbar-thumb {
            background: #FF0033;
            border-radius: 3px;
        }

        .feature-card {
            flex: 0 0 82px;
            background: var(--feature-card-bg);
            border-radius: 10px;
            padding: 5px 4px;
            border: 2px solid var(--border-color);
            text-align: center;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            cursor: default;
            will-change: transform;
        }
        .feature-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 10px;
            background: radial-gradient(circle at center, rgba(255, 0, 51, 0.06), transparent 70%);
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .feature-card:hover {
            border-color: #FF0033;
            transform: scale(1.06) translateY(-3px);
            box-shadow: 0 10px 28px rgba(255, 0, 51, 0.06);
            background: rgba(255, 255, 255, 0.04);
        }
        .feature-card:hover::before {
            opacity: 1;
        }
        .feature-card:active {
            transform: scale(0.95);
        }
