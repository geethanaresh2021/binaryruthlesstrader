<!-- SECTION: ADMIN PASSWORD POPUP                 -->
<!-- FILE: admin-password-popup.html               -->
<!-- Contains: HTML + CSS + JS for Admin Login     -->
<!-- ============================================ -->

<style>
    /* ─── PASSWORD OVERLAY CSS ─── */
    .password-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.85);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 10001;
        padding: 20px;
        backdrop-filter: blur(12px);
    }
    .password-overlay.active {
        display: flex;
    }

    .password-modal {
        background: rgba(20,20,20,0.97);
        backdrop-filter: blur(20px);
        border: 2px solid #FF0033;
        border-radius: 16px;
        padding: 28px 22px;
        width: 100%;
        max-width: 380px;
        text-align: center;
        box-shadow: 0 0 60px rgba(255,0,51,0.08);
        position: relative;
        animation: modalSlideIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes modalSlideIn {
        0% { opacity: 0; transform: translateY(30px) scale(0.96); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .password-modal .close-btn {
        position: absolute;
        top: 10px;
        right: 14px;
        font-size: 1.2rem;
        color: #FF0033;
        cursor: pointer;
        background: none;
        border: none;
        transition: all 0.3s ease;
        font-weight: 700;
    }
    .password-modal .close-btn:hover {
        transform: scale(1.2) rotate(90deg);
    }
    .password-modal .close-btn:active {
        transform: scale(0.9);
    }

    .password-modal .lock-icon {
        font-size: 2.4rem;
        color: #FF0033;
        margin-bottom: 8px;
        animation: pulseIcon 2s ease-in-out infinite;
    }
    @keyframes pulseIcon {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1); }
    }

    .password-modal h2 {
        color: #FFD700;
        font-family: 'Orbitron', sans-serif;
        font-size: 1rem;
        margin-bottom: 14px;
        letter-spacing: 2px;
    }

    .password-modal input {
        width: 100%;
        padding: 10px;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,0,51,0.15);
        border-radius: 6px;
        color: #ffffff;
        font-family: 'Roboto Mono', monospace;
        font-size: 0.8rem;
        text-align: center;
        outline: none;
        transition: all 0.3s ease;
    }
    .password-modal input:focus {
        border-color: #FF0033;
        box-shadow: 0 0 24px rgba(255,0,51,0.05);
    }
    .password-modal input.correct {
        border-color: #00FF66;
        box-shadow: 0 0 24px rgba(0,255,102,0.2);
    }
    .password-modal input.wrong {
        border-color: #ff0033;
        animation: shake 0.5s;
    }
    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-10px); }
        75% { transform: translateX(10px); }
    }

    .password-modal .btn-enter {
        width: 100%;
        padding: 10px;
        margin-top: 12px;
        border-radius: 30px;
        font-weight: 700;
        border: none;
        cursor: not-allowed;
        transition: all 0.3s ease;
        font-family: 'Inter', sans-serif;
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 2px;
        background: rgba(255,0,51,0.05);
        border: 1px solid rgba(255,0,51,0.1);
        color: #666;
    }
    .password-modal .btn-enter.enabled {
        background: #FF0033;
        color: #fff;
        cursor: pointer;
        box-shadow: 0 0 24px rgba(255,0,51,0.2);
        border-color: #FF0033;
    }
    .password-modal .btn-enter.enabled:hover {
        box-shadow: 0 0 40px rgba(255,0,51,0.3);
        transform: scale(1.02);
    }
    .password-modal .btn-enter.enabled:active {
        transform: scale(0.97);
    }

    .password-modal .error-text {
        color: #FF0033;
        font-size: 0.6rem;
        margin-top: 8px;
        font-family: 'Roboto Mono', monospace;
        min-height: 18px;
    }

    /* ─── MOBILE ─── */
    @media (max-width: 480px) {
        .password-modal {
            padding: 24px 18px;
            max-width: 95%;
        }
        .password-modal h2 {
            font-size: 0.85rem;
        }
        .password-modal input {
            font-size: 0.7rem;
            padding: 8px;
        }
        .password-modal .btn-enter {
            font-size: 0.65rem;
            padding: 8px;
        }
        .password-modal .lock-icon {
            font-size: 2rem;
        }
    }
</style>

<!-- ─── PASSWORD OVERLAY HTML ─── -->
<div class="password-overlay" id="passwordOverlay">
    <div class="password-modal">
        <button class="close-btn" onclick="hidePasswordPopup()">✕</button>
        <div class="lock-icon">🔐</div>
        <h2>ENTER ADMIN PASSWORD</h2>
        <input type="password" id="adminPassInput" placeholder="Enter password..." oninput="checkAdminPassword()">
        <button class="btn-enter" id="adminLoginBtn" onclick="adminLogin()">Enter</button>
        <div class="error-text" id="adminPassError"></div>
    </div>
</div>

<script>
    // ─── PASSWORD POPUP FUNCTIONS ───

    let adminLoggedIn = false;

    // Show Password Popup
    function showPasswordPopup() {
        document.getElementById('passwordOverlay').classList.add('active');
        document.getElementById('adminPassInput').value = '';
        document.getElementById('adminLoginBtn').disabled = true;
        document.getElementById('adminLoginBtn').classList.remove('enabled');
        document.getElementById('adminPassInput').classList.remove('correct', 'wrong');
        document.getElementById('adminPassError').textContent = '';
        setTimeout(() => document.getElementById('adminPassInput').focus(), 100);
    }

    // Hide Password Popup
    function hidePasswordPopup() {
        document.getElementById('passwordOverlay').classList.remove('active');
        window.location.href = 'index.html';
    }

    // Check Admin Password (on input)
    function checkAdminPassword() {
        const pass = document.getElementById('adminPassInput').value;
        const loginBtn = document.getElementById('adminLoginBtn');
        const errorEl = document.getElementById('adminPassError');
        const storedPassword = (typeof appState !== 'undefined') ? appState.password : 'admin123';

        if (pass === storedPassword) {
            loginBtn.disabled = false;
            loginBtn.classList.add('enabled');
            document.getElementById('adminPassInput').classList.add('correct');
            document.getElementById('adminPassInput').classList.remove('wrong');
            errorEl.textContent = '';
        } else {
            loginBtn.disabled = true;
            loginBtn.classList.remove('enabled');
            document.getElementById('adminPassInput').classList.remove('correct');
            if (pass.length > 0) {
                document.getElementById('adminPassInput').classList.add('wrong');
                errorEl.textContent = '❌ Incorrect password';
            } else {
                document.getElementById('adminPassInput').classList.remove('wrong');
                errorEl.textContent = '';
            }
        }
    }

    // Admin Login
    function adminLogin() {
        const pass = document.getElementById('adminPassInput').value;
        const storedPassword = (typeof appState !== 'undefined') ? appState.password : 'admin123';

        if (pass === storedPassword) {
            adminLoggedIn = true;
            sessionStorage.setItem('admin_logged_in', 'true');
            document.getElementById('passwordOverlay').classList.remove('active');
            document.getElementById('adminPassInput').value = '';

            // Show admin area
            const adminDashboard = document.getElementById('adminDashboard');
            const adminArea = document.getElementById('adminArea');
            if (adminDashboard) adminDashboard.style.display = 'block';
            if (adminArea) adminArea.style.display = 'block';

            // Load data
            if (typeof loadLocalState === 'function') loadLocalState();
        }
    }

    // Enter key to login
    document.getElementById('adminPassInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !document.getElementById('adminLoginBtn').disabled) {
            adminLogin();
        }
    });

    // Check session on load
    document.addEventListener('DOMContentLoaded', function() {
        const adminSession = sessionStorage.getItem('admin_logged_in');
        if (adminSession === 'true') {
            adminLoggedIn = true;
            document.getElementById('passwordOverlay').classList.remove('active');
            const adminDashboard = document.getElementById('adminDashboard');
            const adminArea = document.getElementById('adminArea');
            if (adminDashboard) adminDashboard.style.display = 'block';
            if (adminArea) adminArea.style.display = 'block';
            if (typeof loadLocalState === 'function') loadLocalState();
        } else {
            showPasswordPopup();
        }
    });

    // Expose functions globally
    window.showPasswordPopup = showPasswordPopup;
    window.hidePasswordPopup = hidePasswordPopup;
    window.checkAdminPassword = checkAdminPassword;
    window.adminLogin = adminLogin;
</script>
