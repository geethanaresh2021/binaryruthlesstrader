<style>
    /* ─── CHANGE PASSWORD CSS ─── */
    .admin-section {
        border: 1px solid rgba(255,215,0,0.15);
        border-radius: 12px;
        padding: 14px 16px;
        margin-bottom: 10px;
        background: rgba(255,255,255,0.02);
        transition: all 0.3s ease;
        cursor: default;
    }
    .admin-section:hover {
        border-color: rgba(255, 215, 0, 0.3);
        box-shadow: 0 0 24px rgba(255,215,0,0.08);
    }
    .admin-section h4 {
        color: #FFD700;
        font-size: 0.7rem;
        margin-bottom: 10px;
        font-family: 'Orbitron', sans-serif;
        letter-spacing: 1px;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .admin-section .field-group {
        margin-bottom: 8px;
    }
    .admin-section .field-group label {
        font-size: 0.5rem;
        color: #aaa;
        display: block;
        margin-bottom: 3px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-weight: 600;
    }
    .admin-section .field-group input {
        width: 100%;
        padding: 7px 12px;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,0,51,0.1);
        border-radius: 6px;
        color: #ffffff;
        font-family: 'Inter', sans-serif;
        font-size: 0.7rem;
        outline: none;
        transition: all 0.3s ease;
    }
    .admin-section .field-group input:focus {
        border-color: #FF0033;
        box-shadow: 0 0 16px rgba(255,0,51,0.03);
    }
    .admin-section .field-group input:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .admin-section .btn-row {
        display: flex;
        gap: 8px;
        margin-top: 6px;
    }
    .admin-section .btn-row .btn-edit {
        flex: 1;
        padding: 7px;
        border-radius: 6px;
        font-weight: 700;
        border: none;
        cursor: pointer;
        transition: all 0.3s ease;
        font-family: 'Inter', sans-serif;
        font-size: 0.55rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        background: #ffffff;
        color: #000000;
    }
    .admin-section .btn-row .btn-edit:hover {
        box-shadow: 0 0 24px rgba(255,255,255,0.15);
        transform: scale(1.02);
    }
    .admin-section .btn-row .btn-edit:active {
        transform: scale(0.95);
    }
    .admin-section .btn-row .btn-save {
        flex: 1;
        padding: 7px;
        border-radius: 6px;
        font-weight: 700;
        border: none;
        cursor: pointer;
        transition: all 0.3s ease;
        font-family: 'Inter', sans-serif;
        font-size: 0.55rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        background: #FF0033;
        color: #ffffff;
        display: none;
    }
    .admin-section .btn-row .btn-save:hover {
        box-shadow: 0 0 24px rgba(255,0,51,0.2);
        transform: scale(1.02);
    }
    .admin-section .btn-row .btn-save:active {
        transform: scale(0.95);
    }
    .admin-section .btn-row .btn-save.show {
        display: block;
    }

    .password-success {
        color: #00FF66;
        font-size: 0.55rem;
        margin-top: 4px;
        text-align: center;
        display: none;
    }
    .password-success.show {
        display: block;
    }

    /* ─── MOBILE ─── */
    @media (max-width: 480px) {
        .admin-section {
            padding: 10px 12px;
            border-radius: 10px;
        }
        .admin-section h4 {
            font-size: 0.6rem;
        }
    }
</style>

<!-- ─── CHANGE PASSWORD HTML ─── -->
<div class="admin-section" id="changePasswordSection">
    <h4 style="color:#FFD700;">🔐 Change Password</h4>
    <div class="field-group">
        <label>New Password</label>
        <input type="password" id="adminNewPassword" placeholder="Enter new password" disabled>
    </div>
    <div class="field-group">
        <label>Confirm New Password</label>
        <input type="password" id="adminConfirmPassword" placeholder="Confirm new password" disabled>
    </div>
    <div class="password-success" id="passwordSuccessMsg">✅ Password changed successfully!</div>
    <div class="btn-row">
        <button class="btn-edit" onclick="enablePasswordEdit(this)">✏️ Edit</button>
        <button class="btn-save" onclick="changeAdminPassword()">💾 Save</button>
    </div>
</div>

<script>
    // ─── CHANGE PASSWORD FUNCTIONS ───

    // Enable Edit Mode
    function enablePasswordEdit(btn) {
        const section = btn.closest('.admin-section');
        if (!section) return;
        section.querySelectorAll('input').forEach(i => i.disabled = false);
        section.querySelectorAll('.btn-save').forEach(b => b.classList.add('show'));
        btn.style.display = 'none';
        document.getElementById('passwordSuccessMsg').classList.remove('show');
    }

    // Disable Edit Mode
    function disablePasswordEdit(section) {
        if (!section) return;
        section.querySelectorAll('input').forEach(i => {
            i.disabled = true;
            i.value = '';
        });
        section.querySelectorAll('.btn-save').forEach(b => b.classList.remove('show'));
        section.querySelectorAll('.btn-edit').forEach(b => {
            b.style.display = 'block';
            b.textContent = '✏️ Edit';
        });
    }

    // Change Admin Password
    function changeAdminPassword() {
        const newPass = document.getElementById('adminNewPassword').value;
        const confirmPass = document.getElementById('adminConfirmPassword').value;

        if (newPass.length < 4) {
            alert('Password must be at least 4 characters!');
            return;
        }

        if (newPass !== confirmPass) {
            alert('Passwords do not match!');
            return;
        }

        // Update password in appState
        if (typeof appState !== 'undefined') {
            appState.password = newPass;
            if (typeof saveLocalState === 'function') saveLocalState();
        }

        // Keep admin logged in
        sessionStorage.setItem('admin_logged_in', 'true');

        // Show success message
        const successMsg = document.getElementById('passwordSuccessMsg');
        successMsg.classList.add('show');

        // Clear fields and disable
        const section = document.getElementById('changePasswordSection');
        disablePasswordEdit(section);

        // Update save button
        const btn = section.querySelector('.btn-save');
        if (btn) {
            btn.textContent = '✅ Saved';
            setTimeout(() => { btn.textContent = '💾 Save'; }, 2000);
        }

        // Hide success message after delay
        setTimeout(() => {
            successMsg.classList.remove('show');
        }, 3000);
    }

    // Expose functions globally
    window.changeAdminPassword = changeAdminPassword;
    window.enablePasswordEdit = enablePasswordEdit;
</script>
