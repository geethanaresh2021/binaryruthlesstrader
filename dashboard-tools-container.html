<!-- SECTION: DASHBOARD TOOLS CONTAINER            -->
<!-- FILE: dashboard-tools-container.html          -->
<!-- Contains: HTML + CSS + JS for Tools Display   -->
<!-- ============================================ -->

<style>
    /* ─── TOOLS CONTAINER CSS ─── */
    .tools-container {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin: 4px 0 6px 0;
        padding: 0 2px;
    }
    .tool-btn {
        width: 100%;
        padding: 18px 20px;
        background: rgba(255,215,0,0.04);
        border: 2px solid rgba(255,215,0,0.12);
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 85px;
        position: relative;
        overflow: hidden;
    }
    .tool-btn::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, rgba(255, 215, 0, 0.04), transparent 70%);
        opacity: 0;
        transition: opacity 0.4s ease;
        border-radius: 10px;
    }
    .tool-btn:hover {
        border-color: #FFD700;
        background: rgba(255, 215, 0, 0.06);
        transform: scale(1.015);
        box-shadow: 0 0 40px rgba(255, 215, 0, 0.04);
    }
    .tool-btn:hover::before {
        opacity: 1;
    }
    .tool-btn:active {
        transform: scale(0.97);
    }

    .tool-fire {
        display: inline-block;
        font-size: 1em;
        animation: fireZoom 2.5s ease-in-out infinite;
        margin: 0 4px;
        line-height: 1;
    }
    @keyframes fireZoom {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
    }
    .tool-fire:first-child { animation-delay: 0s; }
    .tool-fire:last-child { animation-delay: 0.4s; }

    .tool-name {
        font-family: 'Orbitron', sans-serif;
        font-size: clamp(1.1rem, 1.8vw, 1.6rem);
        color: #ffffff;
        font-weight: 900;
        letter-spacing: 1.5px;
        position: relative;
        z-index: 1;
        text-shadow: 0 0 30px rgba(255,255,255,0.08);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 2px;
        animation: toolNameZoom 3.5s ease-in-out infinite;
    }
    @keyframes toolNameZoom {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.03); }
    }
    .tool-name .ruthless-in-tool {
        color: #FF0033 !important;
        text-shadow: 0 0 20px rgba(255, 0, 51, 0.3);
    }
    .tool-btn .tool-subname {
        font-family: 'Inter', sans-serif;
        font-size: clamp(0.65rem, 1vw, 0.85rem);
        color: #FF0033;
        margin-top: 5px;
        font-weight: 600;
        letter-spacing: 0.5px;
        position: relative;
        z-index: 1;
    }

    /* ─── MOBILE ─── */
    @media (max-width: 768px) {
        .tool-btn {
            padding: 14px 16px;
            min-height: 65px;
        }
        .tool-btn .tool-name {
            font-size: 1rem;
        }
        .tool-btn .tool-subname {
            font-size: 0.6rem;
        }
    }
    @media (max-width: 480px) {
        .tool-btn {
            padding: 12px 14px;
            min-height: 60px;
        }
        .tool-btn .tool-name {
            font-size: 0.85rem;
        }
        .tool-btn .tool-subname {
            font-size: 0.55rem;
        }
    }
</style>

<!-- ─── TOOLS CONTAINER HTML ─── -->
<div class="tools-container" id="toolsContainer"></div>

<script>
    // ─── TOOLS CONTAINER FUNCTIONS ───

    // Render tools from appState
    function renderTools() {
        const container = document.getElementById('toolsContainer');
        if (!container) return;
        container.innerHTML = '';
        
        const tools = (typeof appState !== 'undefined' && appState.tools) ? appState.tools : [];
        const visibleTools = tools.filter(tool => tool.visibility === 'visible');
        
        if (visibleTools.length === 0) {
            container.innerHTML = '';
            return;
        }
        
        visibleTools.forEach((tool, idx) => {
            const btn = document.createElement('button');
            btn.className = 'tool-btn';
            
            let toolNameHtml = tool.name || 'Untitled Tool';
            if (toolNameHtml.includes('RUTHLESS')) {
                toolNameHtml = toolNameHtml.replace(/RUTHLESS/g, '<span class="ruthless-in-tool">RUTHLESS</span>');
            }
            
            const showFire = tool.showFire !== undefined ? tool.showFire : true;
            
            btn.innerHTML = `
                <div class="tool-name">
                    ${showFire ? '<span class="tool-fire">🔥</span>' : ''}
                    ${toolNameHtml}
                    ${showFire ? '<span class="tool-fire">🔥</span>' : ''}
                </div>
                ${tool.subName ? `<div class="tool-subname">${tool.subName}</div>` : ''}
            `;
            
            const globalIdx = tools.indexOf(tool);
            btn.addEventListener('click', function() {
                if (typeof openToolFullscreen === 'function') {
                    openToolFullscreen(globalIdx);
                }
            });
            
            container.appendChild(btn);
        });
    }

    // Expose functions globally
    window.renderTools = renderTools;
</script>
