<!-- FILE: admin-revenue.html                      -->
<!-- Contains: HTML + CSS + JS for Revenue Stats   -->
<!-- ============================================ -->

<style>
    /* ─── REVENUE DASHBOARD CSS ─── */
    .revenue-summary {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 10px;
        margin-bottom: 10px;
    }
    .revenue-card {
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,0,51,0.06);
        border-radius: 10px;
        padding: 12px 10px;
        text-align: center;
        transition: all 0.3s ease;
    }
    .revenue-card:hover {
        border-color: #FF0033;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(255,0,51,0.06);
    }
    .revenue-card .revenue-icon {
        font-size: 1.2rem;
        display: block;
        margin-bottom: 4px;
    }
    .revenue-card .revenue-number {
        font-family: 'Roboto Mono', monospace;
        font-size: 1.3rem;
        font-weight: 700;
        display: block;
        margin: 2px 0;
    }
    .revenue-card .revenue-number.green {
        color: #00FF66;
    }
    .revenue-card .revenue-number.gold {
        color: #FFD700;
    }
    .revenue-card .revenue-number.red {
        color: #FF0033;
    }
    .revenue-card .revenue-label {
        font-size: 0.45rem;
        color: #aaa;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .revenue-detail-section {
        margin-top: 10px;
    }
    .revenue-detail-section h4 {
        color: #FFD700;
        font-size: 0.65rem;
        font-family: 'Orbitron', sans-serif;
        letter-spacing: 1px;
        margin-bottom: 8px;
    }

    .revenue-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.55rem;
    }
    .revenue-table th {
        background: rgba(255,0,51,0.06);
        color: #FFD700;
        padding: 8px 10px;
        text-align: left;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-size: 0.5rem;
    }
    .revenue-table td {
        padding: 6px 10px;
        border-bottom: 1px solid rgba(255,255,255,0.03);
        color: #aaa;
    }
    .revenue-table tr:hover td {
        background: rgba(255,0,51,0.02);
    }
    .revenue-table .amount {
        color: #00FF66;
        font-weight: 700;
    }
    .revenue-table .status-success {
        color: #00FF66;
    }
    .revenue-table .status-pending {
        color: #FFD700;
    }
    .revenue-table .status-failed {
        color: #FF0033;
    }
    .revenue-table .user-email {
        color: #ffffff;
        font-weight: 600;
    }

    .revenue-table-scroll {
        max-height: 300px;
        overflow-y: auto;
        border: 1px solid rgba(255,0,51,0.05);
        border-radius: 6px;
    }
    .revenue-table-scroll::-webkit-scrollbar {
        width: 4px;
    }
    .revenue-table-scroll::-webkit-scrollbar-thumb {
        background: #FF0033;
        border-radius: 4px;
    }

    .no-revenue {
        color: #666;
        font-size: 0.55rem;
        text-align: center;
        padding: 20px;
    }
</style>

<!-- ─── REVENUE DASHBOARD HTML ─── -->
<div class="revenue-summary" id="revenueSummary">
    <div class="revenue-card">
        <span class="revenue-icon">💰</span>
        <span class="revenue-number green" id="totalRevenue">₹0</span>
        <span class="revenue-label">Total Revenue</span>
    </div>
    <div class="revenue-card">
        <span class="revenue-icon">✅</span>
        <span class="revenue-number gold" id="successfulPayments">0</span>
        <span class="revenue-label">Successful Payments</span>
    </div>
    <div class="revenue-card">
        <span class="revenue-icon">⏳</span>
        <span class="revenue-number red" id="pendingRevenue">₹0</span>
        <span class="revenue-label">Pending Revenue</span>
    </div>
    <div class="revenue-card">
        <span class="revenue-icon">👤</span>
        <span class="revenue-number gold" id="payingUsers">0</span>
        <span class="revenue-label">Paying Users</span>
    </div>
</div>

<div class="revenue-detail-section">
    <h4>📊 All Transactions</h4>
    <div class="revenue-table-scroll">
        <table class="revenue-table" id="revenueTable">
            <thead>
                <tr>
                    <th>User</th>
                    <th>Amount</th>
                    <th>Credits</th>
                    <th>Txn ID</th>
                    <th>Status</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody id="revenueTableBody">
                <tr><td colspan="6" class="no-revenue">No transactions found</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // ─── REVENUE FUNCTIONS ───

    // Calculate and render revenue stats
    function renderRevenueStats() {
        const payments = (typeof appState !== 'undefined' && appState.payments) ? appState.payments : [];

        let totalRevenue = 0;
        let successfulCount = 0;
        let pendingRevenue = 0;
        const payingUsersSet = new Set();

        payments.forEach(p => {
            if (p.status === 'success') {
                totalRevenue += p.amount || 0;
                successfulCount++;
                payingUsersSet.add(p.userEmail);
            } else if (p.status === 'pending') {
                pendingRevenue += p.amount || 0;
            }
        });

        // Update summary cards
        const totalRevEl = document.getElementById('totalRevenue');
        const successPayEl = document.getElementById('successfulPayments');
        const pendingRevEl = document.getElementById('pendingRevenue');
        const payingUsersEl = document.getElementById('payingUsers');

        if (totalRevEl) totalRevEl.textContent = '₹' + totalRevenue;
        if (successPayEl) successPayEl.textContent = successfulCount;
        if (pendingRevEl) pendingRevEl.textContent = '₹' + pendingRevenue;
        if (payingUsersEl) payingUsersEl.textContent = payingUsersSet.size;

        // Render table
        const tableBody = document.getElementById('revenueTableBody');
        if (!tableBody) return;

        if (payments.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="6" class="no-revenue">No transactions found</td></tr>';
            return;
        }

        tableBody.innerHTML = '';
        payments.slice().reverse().forEach(p => {
            const user = (typeof appState !== 'undefined') ? appState.users.find(u => u.email === p.userEmail) : null;
            const userName = user ? user.name || user.email : p.userEmail;
            const statusClass = p.status === 'success' ? 'status-success' : (p.status === 'failed' ? 'status-failed' : 'status-pending');
            const statusText = p.status === 'success' ? '✅ Success' : (p.status === 'failed' ? '❌ Failed' : '⏳ Pending');

            tableBody.innerHTML += `
                <tr>
                    <td class="user-email">${userName}</td>
                    <td class="amount">₹${p.amount || 0}</td>
                    <td>${p.credits || 0}</td>
                    <td>${p.transactionId || 'N/A'}</td>
                    <td class="${statusClass}">${statusText}</td>
                    <td style="font-size:0.45rem;color:#666;">${p.date ? new Date(p.date).toLocaleString() : 'N/A'}</td>
                </tr>
            `;
        });
    }

    // Expose functions globally
    window.renderRevenueStats = renderRevenueStats;

    // Auto-render on load
    document.addEventListener('DOMContentLoaded', function() {
        renderRevenueStats();
    });
</script>
