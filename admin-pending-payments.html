<!-- SECTION: ADMIN PENDING PAYMENTS               -->
<!-- FILE: admin-pending-payments.html             -->
<!-- Contains: HTML + CSS + JS for Pending Payments-->
<!-- ============================================ -->

<style>
    /* ─── PENDING PAYMENTS CSS ─── */
    .payment-card {
        background: rgba(255,215,0,0.03);
        border: 1px solid rgba(255,215,0,0.08);
        border-radius: 8px;
        padding: 14px 16px;
        margin-bottom: 10px;
    }
    .payment-card .payment-row {
        display: flex;
        justify-content: space-between;
        padding: 4px 0;
        font-size: 0.7rem;
        color: #aaa;
        font-weight: 600;
    }
    .payment-card .payment-row .payment-label {
        color: #666;
    }
    .payment-card .payment-row .payment-value {
        color: #ffffff;
        font-weight: 700;
        font-size: 0.75rem;
    }
    .payment-card .payment-row .payment-amount {
        color: #00FF66;
        font-weight: 700;
        font-size: 0.8rem;
    }
    .payment-card .payment-row .payment-credits {
        color: #FFD700;
        font-weight: 700;
        font-size: 0.8rem;
    }
    .payment-card .payment-row .payment-date {
        color: #aaa;
        font-size: 0.6rem;
    }
    .payment-card .payment-actions {
        display: flex;
        gap: 10px;
        margin-top: 8px;
    }
    .payment-card .payment-actions button {
        flex: 1;
        padding: 8px 12px;
        border-radius: 6px;
        border: none;
        font-weight: 700;
        cursor: pointer;
        font-size: 0.6rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: all 0.3s ease;
    }
    .payment-card .payment-actions button:hover {
        transform: scale(1.02);
    }
    .payment-card .payment-actions .btn-approve {
        background: #00FF66;
        color: #000;
    }
    .payment-card .payment-actions .btn-reject {
        background: #FF0033;
        color: #fff;
    }
    .no-payments {
        color: #666;
        font-size: 0.6rem;
        text-align: center;
        padding: 16px;
    }
</style>

<!-- ─── PENDING PAYMENTS POPUP HTML ─── -->
<div class="overlay" id="pendingPaymentsPopup">
    <div class="modal" style="max-width:820px;">
        <button class="modal-close" onclick="closePendingPaymentsPopup()">✕</button>
        <h2>⏳ Pending Payments</h2>
        <div id="pendingPaymentsList" style="max-height:400px;overflow-y:auto;"></div>
        <div id="noPendingPayments" class="no-payments">No pending payments</div>
    </div>
</div>

<script>
    // ─── PENDING PAYMENTS FUNCTIONS ───

    // Open Pending Payments Popup
    function openPendingPaymentsPopup() {
        renderPendingPayments();
        document.getElementById('pendingPaymentsPopup').classList.add('active');
    }

    // Close Pending Payments Popup
    function closePendingPaymentsPopup() {
        document.getElementById('pendingPaymentsPopup').classList.remove('active');
    }

    // Render Pending Payments
    function renderPendingPayments() {
        const container = document.getElementById('pendingPaymentsList');
        if (!container) return;
        container.innerHTML = '';

        const payments = (typeof appState !== 'undefined' && appState.payments) ? appState.payments : [];
        const pending = payments.filter(p => p.status === 'pending');

        if (pending.length === 0) {
            document.getElementById('noPendingPayments').style.display = 'block';
            return;
        }

        document.getElementById('noPendingPayments').style.display = 'none';

        pending.forEach((p, idx) => {
            const actualIdx = payments.indexOf(p);
            const user = (typeof appState !== 'undefined') ? appState.users.find(u => u.email === p.userEmail) : null;
            const userName = user ? user.name || user.email : p.userEmail;
            const accountId = user ? user.accountId || 'N/A' : 'N/A';

            container.innerHTML += `
                <div class="payment-card">
                    <div class="payment-row">
                        <span class="payment-label">Name:</span>
                        <span class="payment-value">${userName}</span>
                    </div>
                    <div class="payment-row">
                        <span class="payment-label">Account ID:</span>
                        <span class="payment-value">${accountId}</span>
                    </div>
                    <div class="payment-row">
                        <span class="payment-label">Amount:</span>
                        <span class="payment-amount">₹${p.amount}</span>
                    </div>
                    <div class="payment-row">
                        <span class="payment-label">Credits:</span>
                        <span class="payment-credits">${p.credits}</span>
                    </div>
                    <div class="payment-row">
                        <span class="payment-label">Txn ID / UTR:</span>
                        <span class="payment-value">${p.transactionId || 'N/A'}</span>
                    </div>
                    <div class="payment-row">
                        <span class="payment-label">Date:</span>
                        <span class="payment-date">${p.date ? new Date(p.date).toLocaleString() : 'N/A'}</span>
                    </div>
                    <div class="payment-actions">
                        <button class="btn-approve" onclick="adminApprovePayment(${actualIdx})">✅ Approve</button>
                        <button class="btn-reject" onclick="adminRejectPayment(${actualIdx})">❌ Reject</button>
                    </div>
                </div>
            `;
        });
    }

    // Approve Payment
    function adminApprovePayment(idx) {
        if (typeof appState === 'undefined') return;
        const payment = appState.payments[idx];
        if (!payment || payment.status !== 'pending') return;

        if (confirm('Approve payment?')) {
            payment.status = 'success';
            const user = appState.users.find(u => u.email === payment.userEmail);
            if (user) {
                user.credits = (user.credits || 0) + payment.credits;
            }
            if (typeof saveLocalState === 'function') saveLocalState();
            renderPendingPayments();
            if (typeof updatePendingCounts === 'function') updatePendingCounts();
        }
    }

    // Reject Payment
    function adminRejectPayment(idx) {
        if (typeof appState === 'undefined') return;
        const payment = appState.payments[idx];
        if (!payment || payment.status !== 'pending') return;

        if (confirm('Reject payment?')) {
            payment.status = 'failed';
            if (typeof saveLocalState === 'function') saveLocalState();
            renderPendingPayments();
            if (typeof updatePendingCounts === 'function') updatePendingCounts();
        }
    }

    // Close on Escape
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            closePendingPaymentsPopup();
        }
    });

    // Expose functions globally
    window.openPendingPaymentsPopup = openPendingPaymentsPopup;
    window.closePendingPaymentsPopup = closePendingPaymentsPopup;
    window.renderPendingPayments = renderPendingPayments;
    window.adminApprovePayment = adminApprovePayment;
    window.adminRejectPayment = adminRejectPayment;
</script>
