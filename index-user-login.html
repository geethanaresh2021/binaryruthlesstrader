<!-- JS: handleLogin() + helpers                  -->

<script>
window.isValidEmail = function(email) {
    return /^[^\s@]+@gmail\.com$/.test(email);
};

window.showInfoPopup = function(icon, title, message, btnText, btnAction) {
    const popup = document.getElementById('infoPopup');
    document.getElementById('infoPopupIcon').textContent = icon || 'ℹ️';
    document.getElementById('infoPopupTitle').textContent = title || 'Info';
    document.getElementById('infoPopupMessage').textContent = message || 'Message here';
    const btn = document.getElementById('infoPopupBtn');
    if (btnText) {
        btn.style.display = 'block';
        btn.textContent = btnText;
        btn.className = 'popup-btn center-btn';
        if (btnText.toLowerCase().includes('signup') || btnText.toLowerCase().includes('continue')) btn.classList.add('btn-gold');
        else btn.classList.add('btn-white');
        const newBtn = btn.cloneNode(true);
        btn.parentNode.replaceChild(newBtn, btn);
        newBtn.addEventListener('click', function(e) {
            if (typeof btnAction === 'function') btnAction();
            window.closeInfoPopup();
        });
    } else { btn.style.display = 'none'; }
    popup.classList.add('active');
};

window.closeInfoPopup = function() {
    document.getElementById('infoPopup').classList.remove('active');
};

window.openModal = function(id) { document.getElementById(id).classList.add('active'); };
window.closeModal = function(id) { document.getElementById(id).classList.remove('active'); };

window.handleLogin = function() {
    const email = document.getElementById('loginEmail').value.trim();
    const accountId = document.getElementById('loginAccountId').value.trim();
    const errorEl = document.getElementById('loginError');
    if (!email || !accountId) { errorEl.textContent = '❌ Enter email and account ID'; return; }
    if (!window.isValidEmail(email)) { errorEl.textContent = '❌ Please enter a valid Gmail address (example@gmail.com)'; return; }
    const user = window.appState.users.find(u => u.email === email && u.accountId === accountId);
    if (!user) {
        window.showInfoPopup('📝', 'Account Not Found!', 'No account found with these details. Please sign up first to get started.', 'Sign Up Now', function() {
            window.closeModal('loginModal'); window.openModal('signupModal');
        }); errorEl.textContent = ''; return;
    }
    if (user.blocked) { errorEl.textContent = '🚫 Account blocked. Contact admin.'; return; }
    if (!user.verified) {
        const pendingRequest = window.appState.verificationRequests?.find(req => req.userEmail === email && req.status === 'pending');
        if (pendingRequest) {
            window.showInfoPopup('⏳', 'Verification Pending!', 'Admin is currently reviewing your verification request. Please wait for approval. You will get access once verified.', null, null);
        } else {
            window.showInfoPopup('✅', 'Not Verified Yet!', 'Please submit your verification request first. Admin will review and approve your account.', 'Go to Verify', function() {
                window.closeModal('loginModal'); window.openModal('verifyModal');
            });
        } errorEl.textContent = ''; return;
    }
    window.appState.currentUser = user;
    sessionStorage.setItem('user_logged_in', 'true');
    window.saveLocalState();
    window.closeModal('loginModal');
    errorEl.textContent = '';
    window.location.href = 'dashboard.html';
};
</script>
