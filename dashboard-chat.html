<!-- SECTION: DASHBOARD CHAT                       -->
<!-- FILE: dashboard-chat.html                     -->
<!-- Contains: HTML + CSS + JS for Chat Feature    -->
<!-- ============================================ -->

<style>
    /* ─── CHAT MODAL BASE STYLES ─── */
    .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.85);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        padding: 20px;
        backdrop-filter: blur(10px);
        animation: fadeInChat 0.3s ease;
    }
    .overlay.active {
        display: flex;
    }
    @keyframes fadeInChat {
        0% { opacity: 0; transform: scale(0.96); }
        100% { opacity: 1; transform: scale(1); }
    }

    .modal {
        background: rgba(20,20,20,0.97);
        backdrop-filter: blur(20px);
        border: 2px solid rgba(255,0,51,0.2);
        border-radius: 16px;
        padding: 28px 24px;
        width: 100%;
        max-width: 600px;
        min-height: 280px;
        max-height: 85vh;
        overflow-y: auto;
        position: relative;
        box-shadow: 0 0 80px rgba(255,0,51,0.08);
        animation: modalSlideChat 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes modalSlideChat {
        0% { opacity: 0; transform: translateY(30px) scale(0.96); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .modal::-webkit-scrollbar {
        width: 4px;
    }
    .modal::-webkit-scrollbar-thumb {
        background: #FF0033;
        border-radius: 4px;
    }

    .modal-close {
        position: absolute;
        top: 10px;
        right: 14px;
        font-size: 1.5rem;
        color: #FF0033;
        cursor: pointer;
        background: none;
        border: none;
        transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        padding: 4px 8px;
        border-radius: 6px;
        font-weight: 700;
    }
    .modal-close:hover {
        transform: scale(1.3) rotate(90deg);
        color: #ffffff;
        background: rgba(255,0,51,0.06);
    }
    .modal-close:active {
        transform: scale(0.8);
    }

    .modal h2 {
        color: #FFD700;
        text-align: center;
        font-family: 'Orbitron', sans-serif;
        font-size: 1rem;
        margin-bottom: 14px;
        letter-spacing: 2px;
    }

    /* ─── CHAT CONTAINER ─── */
    .chat-container {
        max-height: 350px;
        overflow-y: auto;
        margin: 8px 0;
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 8px;
        padding: 10px;
        display: flex;
        flex-direction: column;
        background: #000000 !important;
        min-height: 120px;
    }
    .chat-container::-webkit-scrollbar {
        width: 5px;
    }
    .chat-container::-webkit-scrollbar-thumb {
        background: #FF0033;
        border-radius: 4px;
    }

    /* Chat Messages */
    .chat-message.admin {
        background: #FF0033 !important;
        color: #000000 !important;
        align-self: flex-start;
        border-bottom-left-radius: 4px;
        padding: 8px 14px;
        margin: 4px 0;
        border-radius: 8px;
        font-size: 0.85rem;
        max-width: 85%;
        word-wrap: break-word;
        line-height: 1.5;
    }
    .chat-message.user {
        background: #ffffff !important;
        color: #000000 !important;
        align-self: flex-end;
        border-bottom-right-radius: 4px;
        padding: 8px 14px;
        margin: 4px 0;
        border-radius: 8px;
        font-size: 0.85rem;
        max-width: 85%;
        word-wrap: break-word;
        line-height: 1.5;
    }
    .chat-message .time {
        font-size: 0.5rem;
        color: #666;
        margin-left: 8px;
        opacity: 0.7;
    }

    /* Chat Input Area */
    .chat-input-area {
        display: flex;
        gap: 6px;
        margin-top: 8px;
    }
    .chat-input-area input {
        flex: 1;
        padding: 8px 12px;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,0,51,0.1);
        border-radius: 6px;
        color: #ffffff;
        font-size: 0.8rem;
        outline: none;
    }
    .chat-input-area input:focus {
        border-color: #FF0033;
    }
    .chat-input-area button {
        padding: 8px 16px;
        border-radius: 6px;
        border: none;
        background: #0088cc;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
        font-size: 0.7rem;
        transition: all 0.3s ease;
    }
    .chat-input-area button:hover {
        transform: scale(1.04);
    }

    /* ─── CHAT BADGE (on dashboard) ─── */
    .chat-badge {
        position: absolute;
        top: -6px;
        right: -6px;
        background: #FF0033;
        border-radius: 50%;
        border: 2px solid #0a0a0a;
        display: none;
        color: #fff;
        font-size: 0.5rem;
        font-weight: 700;
        min-width: 16px;
        height: 16px;
        padding: 0 4px;
        align-items: center;
        justify-content: center;
        line-height: 16px;
        text-align: center;
    }
    .chat-badge.active {
        display: flex;
        animation: pulseRed 1s ease-in-out infinite;
    }
    .chat-badge.has-count {
        border-radius: 10px;
        min-width: 18px;
        height: 18px;
        font-size: 0.45rem;
        line-height: 18px;
        padding: 0 5px;
    }
    @keyframes pulseRed {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.85); }
    }

    /* ─── MOBILE ─── */
    @media (max-width: 768px) {
        .chat-message {
            font-size: 0.75rem;
            padding: 6px 10px;
        }
        .chat-container {
            max-height: 250px;
            min-height: 100px;
        }
    }
    @media (max-width: 480px) {
        .chat-message {
            font-size: 0.7rem;
            padding: 5px 8px;
        }
        .chat-container {
            max-height: 200px;
            min-height: 80px;
        }
        .modal {
            padding: 16px 14px;
            max-width: 100%;
            max-height: 92vh;
            min-height: 200px;
        }
        .modal h2 {
            font-size: 0.85rem;
        }
    }
</style>

<!-- ─── CHAT MODAL HTML ─── -->
<div class="overlay" id="chatModal">
    <div class="modal">
        <button class="modal-close" onclick="closeChatModal()">✕</button>
        <h2>💬 Chat with Admin</h2>
        <div class="chat-container" id="chatContainer" style="background:#000000 !important;"></div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="Type your message...">
            <button onclick="sendChatMessage()">Send</button>
        </div>
    </div>
</div>

<script>
    // ─── CHAT FUNCTIONS ───
    let chatUnreadCount = 0;

    // Helper to get a safe chat key from email
    function getChatKey(userEmail) {
        return userEmail ? userEmail.replace(/[.#$\/\[\]]/g, '_') : '';
    }

    // Update the chat badge on the dashboard
    function updateChatBadge() {
        const badge = document.getElementById('chatBadge');
        if (!badge) return;
        if (chatUnreadCount > 0) {
            badge.classList.add('active', 'has-count');
            badge.textContent = chatUnreadCount > 9 ? '9+' : chatUnreadCount;
            badge.style.display = 'flex';
            badge.style.width = 'auto';
            badge.style.padding = '0 5px';
            badge.style.minWidth = '18px';
            badge.style.height = '18px';
            badge.style.fontSize = '0.45rem';
            badge.style.lineHeight = '18px';
            badge.style.borderRadius = '10px';
        } else {
            badge.classList.remove('active', 'has-count');
            badge.style.display = 'none';
        }
    }

    // Render chat messages from appState
    function renderChatMessages() {
        const container = document.getElementById('chatContainer');
        if (!container) return;
        container.innerHTML = '';
        container.style.background = '#000000 !important';

        const user = (typeof appState !== 'undefined') ? appState.currentUser : null;
        if (!user) {
            container.innerHTML = '<div style="color:#666;font-size:0.8rem;text-align:center;padding:20px;">Not logged in</div>';
            return;
        }

        const key = getChatKey(user.email);
        const msgs = (typeof appState !== 'undefined' && appState.chats && appState.chats[key]) ? appState.chats[key] : [];

        if (msgs.length === 0) {
            container.innerHTML = '<div style="color:#666;font-size:0.8rem;text-align:center;padding:20px;">No messages yet</div>';
            return;
        }

        msgs.forEach(c => {
            const cls = c.sender === 'admin' ? 'admin' : 'user';
            const time = c.timestamp ? new Date(c.timestamp).toLocaleTimeString() : '';
            container.innerHTML += `<div class="chat-message ${cls}">${c.message}<span class="time">${time}</span></div>`;
            if (c.sender === 'admin' && !c.read) c.read = true;
        });

        container.scrollTop = container.scrollHeight;

        // Save state after marking as read
        if (typeof saveLocalState === 'function') saveLocalState();

        // Recalculate unread
        const unread = msgs.filter(m => m.sender === 'admin' && !m.read).length;
        chatUnreadCount = unread;
        updateChatBadge();
    }

    // Open chat modal
    function openChatModal() {
        const user = (typeof appState !== 'undefined') ? appState.currentUser : null;
        if (!user) return;
        renderChatMessages();
        document.getElementById('chatModal').classList.add('active');
    }

    // Close chat modal
    function closeChatModal() {
        document.getElementById('chatModal').classList.remove('active');
    }

    // Send a chat message (user -> admin)
    function sendChatMessage() {
        const input = document.getElementById('chatInput');
        const msg = input.value.trim();
        const user = (typeof appState !== 'undefined') ? appState.currentUser : null;
        if (!msg || !user) return;

        const key = getChatKey(user.email);
        if (typeof appState !== 'undefined') {
            if (!appState.chats) appState.chats = {};
            if (!appState.chats[key]) appState.chats[key] = [];
            appState.chats[key].push({
                sender: 'user',
                message: msg,
                timestamp: new Date().toISOString(),
                read: false
            });
            if (typeof saveLocalState === 'function') saveLocalState();
        }
        input.value = '';
        renderChatMessages();
    }

    // Allow Enter key to send
    document.getElementById('chatInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') sendChatMessage();
    });

    // Close on Escape
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            closeChatModal();
        }
    });

    // Expose functions globally
    window.openChatModal = openChatModal;
    window.closeChatModal = closeChatModal;
    window.sendChatMessage = sendChatMessage;
    window.renderChatMessages = renderChatMessages;
    window.updateChatBadge = updateChatBadge;
    window.getChatKey = getChatKey;
</script>
